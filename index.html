<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靈光筆記 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#263d40;font:16px/1.8 system-ui,sans-serif}header{background:#244a4b;color:#fff;padding:26px max(18px,calc((100vw - 1050px)/2))}h1,h2,h3{line-height:1.4}h1{margin:0}main{max-width:1050px;margin:auto;padding:22px 16px}button,input{font:inherit;border:1px solid #ccd9d3;border-radius:9px;padding:10px 15px}button{cursor:pointer;background:#fff;color:#244a4b}button.active,button.primary{background:#246b65;color:white}input{width:100%;max-width:500px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card,article{background:#fff;border:1px solid #dce4df;border-radius:15px;padding:20px}.card h2{font-size:20px}.card button{width:100%}.tag{color:#37796e;font-size:14px}.art{width:100%;height:100px;background:#e9efe5;border-radius:10px;display:grid;place-items:center}.art svg{height:90px;width:180px}article{max-width:800px;margin:auto;padding:clamp(18px,4vw,40px)}details{background:#edf3ed;border-radius:10px;padding:12px 16px;margin:16px 0}summary{cursor:pointer;font-weight:bold}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}th,td{border:1px solid #aebfb6;padding:10px;text-align:left}th{background:#e7efe8}.tip{border-left:4px solid #b99b59;background:#f8f2e4;padding:14px}.muted{color:#60736e}footer{text-align:center;padding:24px;color:#60736e}@media print{header,.tabs,.no-print,footer{display:none!important}body,article{background:white}article{border:0;padding:0}main{padding:0}details{break-inside:avoid}table{break-inside:avoid}}</style></head><body><header><h1>靈光筆記 2.0</h1><p>找一個你想弄懂的問題，花點時間試試看。</p></header><main id="app"></main><footer>網站提供探索方向，作品請依老師指定方式繳交。</footer><script>const tasks=[{"id":"0-0","category":"創意發明所","title":"如果書包會抱怨","mission":"找出書包最不好用的一處，觀察自己連續三天拿取物品的情形，再設計改良版。","hint":"例如找不到橡皮擦，究竟是隔層太少還是開口不方便？","output":"草圖、紙模型、使用測試","variables":[]},{"id":"0-1","category":"創意發明所","title":"三種材料做玩具","mission":"從紙、橡皮筋、吸管等安全材料中選三種，做一個有明確玩法的玩具，請家人試玩後修改。","hint":"玩具不一定要會動，也可以考驗平衡或合作。","output":"玩具、試玩影片","variables":[]},{"id":"0-2","category":"創意發明所","title":"不插電提醒器","mission":"挑一件自己常忘記的事，設計不用電的提醒裝置，連續試用三天。","hint":"提醒可以出現在必經之處，不一定要發出聲音。","output":"裝置、試用日誌","variables":[]},{"id":"0-3","category":"創意發明所","title":"雨天的新用途","mission":"觀察雨天生活中一個不方便的地方，設計能利用雨水或雨天特性的物品。","hint":"先想想雨水在哪裡聚集，又有哪些用途；不要飲用收集的雨水。","output":"設計圖、模型","variables":[]},{"id":"0-4","category":"創意發明所","title":"改造教室角落","mission":"選一處教室角落，記錄它現在的用途與困擾，提出兩種改造方案並比較。","hint":"同一個角落可能有人想閱讀，有人需要收納。","output":"平面圖、模型、提案","variables":[]},{"id":"0-5","category":"創意發明所","title":"未來超市","mission":"假想超市取消收銀台，設計一套購物流程，讓不同年齡的人都能使用。","hint":"遇到商品沒有標價或設備故障時，顧客怎麼辦？","output":"流程圖、情境演示","variables":[]},{"id":"0-6","category":"創意發明所","title":"一張紙變工具","mission":"只用一張紙設計能完成一項生活任務的工具，測試後至少修改一次。","hint":"紙的折法可能比紙的大小更重要。","output":"實物、前後比較","variables":[]},{"id":"0-7","category":"創意發明所","title":"新節日企劃局","mission":"設計一個值得大家慶祝的新節日，規劃活動、由來及有限預算，邀請家人評估。","hint":"如果有人不喜歡熱鬧，你的節日還能怎麼參加？","output":"海報、活動企劃","variables":[]},{"id":"0-8","category":"創意發明所","title":"長輩需要的小物","mission":"先詢問家中長輩一件日常小困擾，再設計能改善它的物品，不要替對方猜需求。","hint":"瓶蓋難開可能和握力、摩擦力都有關。","output":"訪談摘要、模型","variables":[]},{"id":"0-9","category":"創意發明所","title":"失敗作品改造","mission":"找出自己曾做得不理想的作品，保留原版，分析問題後重新製作。","hint":"不要只換顏色，試著改善功能或使用方式。","output":"兩版作品、測試紀錄","variables":[]},{"id":"1-0","category":"科學實驗室","title":"紙飛機工程師","mission":"摺出三種紙飛機，從同一位置試飛，找出影響飛行距離的設計，再改良一次。","hint":"飛得遠與飛得直不一定是同一回事。","output":"試飛影片、數據圖","variables":["機翼折法","紙張、投擲位置與方式","飛行距離（公分）"]},{"id":"1-1","category":"科學實驗室","title":"紙橋耐重賽","mission":"用相同大小的紙搭出三種橋面，逐次增加相同重量的物品，比較承重能力。","hint":"平面紙與摺過的紙，形狀如何影響支撐？","output":"橋模型、承重表","variables":["橋面形狀","紙張、橋墩距離、載重位置","最大承重（克）"]},{"id":"1-2","category":"科學實驗室","title":"硬幣上的水滴","mission":"用滴管在硬幣上逐滴加水，比較不同硬幣表面或液體條件能容納的滴數。","hint":"水滴快溢出前的形狀值得仔細觀察。","output":"近照、滴數表","variables":["硬幣表面或液體種類（擇一）","滴管、滴水高度、硬幣大小","溢出前滴數"]},{"id":"1-3","category":"科學實驗室","title":"影子搬家","mission":"在安全的戶外位置固定一根直立物，每隔一段時間記錄影子的長度與方向。","hint":"影子最短的時間一定是鐘錶上的十二點嗎？","output":"影子地圖、時間圖","variables":["觀察時間","物體、位置、測量方法","影長（公分）與方向"]},{"id":"1-4","category":"科學實驗室","title":"冰塊保冷賽","mission":"利用家中材料設計三種保冷方式，比較相同冰塊的融化程度，再改良其中一組。","hint":"毛巾包住冰塊，會讓它融得快還是慢？先預測再試。","output":"保冷裝置、照片、數據圖","variables":["包覆材料","冰塊重量、容器、環境、時間","融水量（毫升）"]},{"id":"1-5","category":"科學實驗室","title":"一張紙的承重","mission":"用相同大小的紙做不同形狀的柱子，逐次增加重量，找出最耐重的形狀。","hint":"柱子的接縫位置會不會影響結果？","output":"模型、承重紀錄","variables":["柱子形狀","紙張、柱高、載重位置","最大承重（克）"]},{"id":"1-6","category":"科學實驗室","title":"植物在哪長得好","mission":"選相同種類的幼苗，放在光照不同但安全的位置，連續觀察至少一週。","hint":"除了高度，也可以觀察葉片數量與顏色。","output":"植物日誌、照片","variables":["光照位置","植物種類、土壤、水量、容器","高度（公分）、葉片數"]},{"id":"1-7","category":"科學實驗室","title":"橡皮筋動力車","mission":"用紙板與橡皮筋做小車，改變一項設計並比較行進距離，不朝人發射。","hint":"輪子大小與車身重量都可能影響結果，但一次只改一項。","output":"小車、測試影片","variables":["橡皮筋圈數或輪徑（擇一）","車身、地面、起點","行進距離（公分）"]},{"id":"1-8","category":"科學實驗室","title":"隔音小實驗","mission":"用盒子與不同安全材料包覆固定音源，在相同距離比較聲音大小。","hint":"隔音與吸音可能不是同一件事。保持音量舒適。","output":"裝置、相對音量表","variables":["包覆材料","音源音量、距離、盒子","相對音量（同一裝置測量）"]},{"id":"1-9","category":"科學實驗室","title":"讓球彈得更高","mission":"從固定高度放下同一顆球，比較不同地面上的反彈高度。","hint":"可以用慢動作影片和背景刻度輔助測量。","output":"影片、比較圖","variables":["地面材質","球、落下高度、測量方法","反彈高度（公分）"]},{"id":"2-0","category":"生活調查局","title":"學校被忽略的角落","mission":"走訪校園三處平常少注意的角落，觀察用途與使用者，提出一項改善建議。","hint":"沒有人停留不代表那裡沒有價值。","output":"觀察地圖、速寫","variables":[]},{"id":"2-1","category":"生活調查局","title":"校園哪裡最熱","mission":"選三個校園位置，在相近時間測量氣溫或地表溫度，分析遮蔭與材質的關係。","hint":"不要把日照下的溫度計讀值直接當成標準氣溫。","output":"地圖、溫度表","variables":[]},{"id":"2-2","category":"生活調查局","title":"商品為什麼擺這裡","mission":"在家人陪同下觀察商店貨架，記錄同類商品的位置與價格，提出可能的陳列理由。","hint":"眼睛高度的商品一定最便宜嗎？","output":"貨架示意圖、比較表","variables":[]},{"id":"2-3","category":"生活調查局","title":"家裡常忘記的事","mission":"記錄自己一週忘記事情的時間與情境，找出規律，試用一種提醒方法。","hint":"忘記可能和轉換活動有關，不只是記性不好。","output":"匿名日誌、改善紀錄","variables":[]},{"id":"2-4","category":"生活調查局","title":"排隊要多久","mission":"選一個安全的排隊場所，記錄不同時段等待時間，分析可能影響速度的因素。","hint":"隊伍長度與等待時間不一定成正比。","output":"時間表、圖表","variables":[]},{"id":"2-5","category":"生活調查局","title":"超商飲料調查","mission":"比較三種同容量飲料的營養標示、價格與成分，說明不同需求下怎麼選。","hint":"每份與每100毫升的數字不能直接混比。","output":"商品比較表","variables":[]},{"id":"2-6","category":"生活調查局","title":"一天的垃圾","mission":"記錄家中一天的垃圾種類與數量，查詢當地分類方式，提出減量方法。不要翻找危險垃圾。","hint":"減少垃圾和把垃圾分類好是兩件事。","output":"分類圖、減量計畫","variables":[]},{"id":"2-7","category":"生活調查局","title":"訪問一種職業","mission":"選一種不熟悉的職業，經對方同意後訪問或查閱公開訪談，比較想像與實際工作。","hint":"除了工作內容，也問問哪些事情最需要判斷力。","output":"職業介紹、匿名訪談摘要","variables":[]},{"id":"2-8","category":"生活調查局","title":"校園人氣地圖","mission":"觀察校園不同空間的使用情形，畫出人氣地圖，分析不同時段的差異。","hint":"熱門地點可能只是必經之路。","output":"地圖、觀察表","variables":[]},{"id":"2-9","category":"生活調查局","title":"大家真的都這麼想","mission":"選一個生活中的常見說法，設計不誘導答案的小調查，比較結果與原先猜測。","hint":"問『你喜歡運動嗎』和『你每週運動幾次』得到的資訊不同。","output":"匿名統計、圖表","variables":[]},{"id":"3-0","category":"心情練習所","title":"明明不是我的錯","mission":"回想或虛構一次雙方都覺得自己沒錯的爭執，畫出事件經過，找出能避免升高衝突的做法。","hint":"對方先惹你，不代表你的每個反應都合理。","output":"漫畫、情境演示","variables":[]},{"id":"3-1","category":"心情練習所","title":"失敗收藏盒","mission":"選一次願意分享的小失敗，整理原先期待、實際結果與後來學到的事，設計下一次嘗試。","hint":"不必分享私密經驗，也可以用虛構例子。","output":"手帳、作品前後比較","variables":[]},{"id":"3-2","category":"心情練習所","title":"朋友一直求幫忙","mission":"設計三種朋友請你幫忙的情境，比較答應、拒絕與協商的後果，和家人演練。","hint":"幫忙和替對方完成所有事情不同。","output":"對話漫畫、角色演示","variables":[]},{"id":"3-3","category":"心情練習所","title":"被打斷的時候","mission":"觀察或虛構一次說話被打斷的情境，試寫不同反應並演練哪種能表達需求。","hint":"一句『等我說完』也可以有不同語氣。","output":"對話卡、影片","variables":[]},{"id":"3-4","category":"心情練習所","title":"拖到最後一天","mission":"記錄一項容易拖延的小任務，找出開始前的阻礙，試行一個方法三天。","hint":"把第一步縮小到兩分鐘，是否比較容易開始？","output":"計畫表、試行紀錄","variables":[]},{"id":"3-5","category":"心情練習所","title":"一句話兩種意思","mission":"挑三句可能被誤會的日常用語，設計不同語氣與情境，比較聽者可能的理解。","hint":"『你好厲害喔』可能是真心稱讚，也可能不是。","output":"漫畫、配音影片","variables":[]},{"id":"3-6","category":"心情練習所","title":"輸掉遊戲以後","mission":"設計一個輸掉遊戲的情境，比較不同反應對自己、隊友和下一場遊戲的影響。","hint":"想贏和尊重對手並不衝突。","output":"情境卡、短劇","variables":[]},{"id":"3-7","category":"心情練習所","title":"別人不想聽建議","mission":"找一個別人不接受建議的虛構情境，分析對方可能的理由，練習先詢問再提供意見。","hint":"對方可能只想被聽見，而不是立刻解決問題。","output":"對話圖、角色演練","variables":[]},{"id":"3-8","category":"心情練習所","title":"情緒警報器","mission":"觀察自己在輕微煩躁時的身體訊號，設計一張提醒卡，試用並修正。","hint":"握拳、說話變快都可能是提醒訊號。","output":"提醒卡、試用日誌","variables":[]},{"id":"3-9","category":"心情練習所","title":"有些話要不要說","mission":"設計三個想說真話卻怕傷人的情境，比較直接說、換方式說與暫時不說。","hint":"內容相同，時間與場合不同，效果可能不同。","output":"情境漫畫、對話卡","variables":[]},{"id":"4-0","category":"思辨選擇題","title":"公平就是一樣多嗎","mission":"假設10份點心要分給5人，但需求和付出不同。設計至少三種分配原則，用生活中的另一個例子測試它們。","hint":"尺寸相同的鞋送給腳大小不同的人，算公平嗎？","output":"分配遊戲、比較表、觀點短文","variables":[]},{"id":"4-1","category":"思辨選擇題","title":"安全可以限制自由嗎","mission":"假設學校為了安全禁止所有下課奔跑，分析學生、老師及受傷風險較高者的需求，提出替代規則。","hint":"禁止所有活動與限制危險區域，有何不同？","output":"規則提案、利弊表","variables":[]},{"id":"4-2","category":"思辨選擇題","title":"善意的謊言","mission":"蒐集或虛構三種善意謊言情境，比較說真話與隱瞞的短期、長期影響，再提出自己的判斷原則。","hint":"驚喜派對的保密和隱瞞危險資訊是否相同？","output":"案例比較、觀點影片","variables":[]},{"id":"4-3","category":"思辨選擇題","title":"成績代表努力嗎","mission":"比較幾個虛構學生的準備時間、起點與測驗結果，討論成績能說明什麼、不能說明什麼。","hint":"進步最多的人未必分數最高。","output":"比較圖、評量提案","variables":[]},{"id":"4-4","category":"思辨選擇題","title":"每個人都該幫忙嗎","mission":"假設班級需要志工完成活動，設計自願、輪流及強制分工三種方案，分析各方負擔。","hint":"有能力幫忙的人是否一定有義務幫忙？","output":"分工方案、辯論紀錄","variables":[]},{"id":"4-5","category":"思辨選擇題","title":"AI寫作業算作弊嗎","mission":"比較AI解釋知識、提供靈感、修改初稿及代寫作業四種用法，依不同學習目標提出使用原則。","hint":"練習寫作和查找資料時，AI的角色可能不同。","output":"使用守則、案例表","variables":[]},{"id":"4-6","category":"思辨選擇題","title":"少數意見要聽嗎","mission":"模擬班級投票決定活動，設計一個少數人無法參加的情境，找出兼顧效率與權益的決策方法。","hint":"多數決能決定喜好，但能決定所有人的基本權益嗎？","output":"決策流程、角色觀點卡","variables":[]},{"id":"4-7","category":"思辨選擇題","title":"獎勵讓人更好嗎","mission":"比較有獎勵與無獎勵的助人情境，找公開資料或匿名訪談，區分行為增加與動機改變。","hint":"獎勵取消後，行為是否還會持續？","output":"證據表、觀點短文","variables":[]},{"id":"4-8","category":"思辨選擇題","title":"犯錯值得第二次機會嗎","mission":"設計三種嚴重程度不同的虛構犯錯情境，分析第二次機會、補救責任與受影響者的安全。","hint":"原諒一個人和立刻恢復信任是同一件事嗎？","output":"案例卡、判斷原則","variables":[]},{"id":"4-9","category":"思辨選擇題","title":"規則本身不公平","mission":"找一條虛構或公開規則，分析它原本的目的、可能的不公平與修改後的副作用，提出可行修正。","hint":"一條規則對所有人文字相同，結果也一定相同嗎？","output":"修法提案、正反論證","variables":[]},{"id":"5-0","category":"世界探險家","title":"消失的老行業","mission":"選一種逐漸消失的行業，查找不同年代的公開資料，分析技術與生活需求如何改變工作。","hint":"消失的工作可能轉變成另一種職業。","output":"時間軸、職業小展覽","variables":[]},{"id":"5-1","category":"世界探險家","title":"沒有紅綠燈的城市","mission":"研究紅綠燈、圓環與行人設施的用途，設計沒有紅綠燈的虛構路口並分析風險。","hint":"車流少的地方和繁忙路口需要相同設計嗎？","output":"路口模型、交通圖","variables":[]},{"id":"5-2","category":"世界探險家","title":"衣服走過幾個國家","mission":"查看一件衣服的產地與材質標示，查找原料、製造、運輸可能經過的地區，標示已知與未知。","hint":"產地標籤不一定代表所有原料來自同一國。","output":"世界地圖、供應鏈圖","variables":[]},{"id":"5-3","category":"世界探險家","title":"百年前的學校","mission":"找兩種百年前學校生活的史料，與今天比較課程、設備或規則，說明差異與可能原因。","hint":"照片只能看見部分生活，不能代表所有學校。","output":"古今對照、時間軸","variables":[]},{"id":"5-4","category":"世界探險家","title":"食物跨海旅行","mission":"選一種常吃的食物，追查它的原產地、傳播與在臺灣的變化，核對至少兩個來源。","hint":"現在常吃的食物不一定原本就生長在臺灣。","output":"食物旅行地圖","variables":[]},{"id":"5-5","category":"世界探險家","title":"AI成為同學","mission":"研究AI在學習中的兩種實際用途，設計未來教室的一天，說明哪些工作仍需要人判斷。","hint":"能快速回答不代表能確認答案正確。","output":"未來教室漫畫、簡報","variables":[]},{"id":"5-6","category":"世界探險家","title":"城市為什麼種樹","mission":"比較城市樹木的遮蔭、降溫、生態與維護需求，觀察附近安全地點並提出種樹建議。","hint":"樹種、根系與道路空間也需要考慮。","output":"城市設計圖、觀察紀錄","variables":[]},{"id":"5-7","category":"世界探險家","title":"災害改變了什麼","mission":"選一場歷史自然災害，查閱官方或博物館資料，整理災前、災後與防災措施的改變。","hint":"災害本身與社會如何應對是不同問題。","output":"時間軸、防災海報","variables":[]},{"id":"5-8","category":"世界探險家","title":"地圖沒說的故事","mission":"比較同一地區的兩種公開地圖，例如交通圖與地形圖，分析各自呈現與省略的資訊。","hint":"地圖的用途會影響它選擇畫什麼。","output":"自製主題地圖","variables":[]},{"id":"5-9","category":"世界探險家","title":"十年後少了什麼","mission":"選一件現在常見的物品，查找技術發展線索，提出十年後可能被替代或保留的兩種情境。","hint":"新技術出現不代表舊物一定消失。","output":"未來情境圖、比較簡報","variables":[]}];const cats=['全部',...new Set(tasks.map(t=>t.categ
