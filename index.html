<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>靈光筆記 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#263d40;font:16px/1.8 system-ui,sans-serif}header{background:#244a4b;color:#fff;padding:26px max(18px,calc((100vw - 1050px)/2))}h1,h2,h3{line-height:1.4}h1{margin:0}main{max-width:1050px;margin:auto;padding:22px 16px}button,input{font:inherit;border:1px solid #ccd9d3;border-radius:9px;padding:10px 15px}button{cursor:pointer;background:#fff;color:#244a4b}button.active,button.primary{background:#246b65;color:white}input{width:100%;max-width:500px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card,article{background:#fff;border:1px solid #dce4df;border-radius:15px;padding:20px}.card h2{font-size:20px}.card button{width:100%}.tag{color:#37796e;font-size:14px}.art{width:100%;height:100px;background:#e9efe5;border-radius:10px;display:grid;place-items:center}.art svg{height:90px;width:180px}article{max-width:800px;margin:auto;padding:clamp(18px,4vw,40px)}details{background:#edf3ed;border-radius:10px;padding:12px 16px;margin:16px 0}summary{cursor:pointer;font-weight:bold}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}th,td{border:1px solid #aebfb6;padding:10px;text-align:left}th{background:#e7efe8}.tip{border-left:4px solid #b99b59;background:#f8f2e4;padding:14px}.muted{color:#60736e}footer{text-align:center;padding:24px;color:#60736e}@media print{header,.tabs,.no-print,footer{display:none!important}body,article{background:white}article{border:0;padding:0}main{padding:0}details{break-inside:avoid}table{break-inside:avoid}}.intro{background:white;border:1px solid #dce4df;border-radius:15px;padding:20px;margin:16px 0}.intro dl{display:grid;grid-template-columns:52px 1fr;gap:8px 12px}.intro dt{font-weight:700;color:#246b65}.intro dd{margin:0}.intro p{margin-top:0}.evidence{background:#eef5ee;border-left:4px solid #42796c;padding:12px 16px;margin:18px 0;border-radius:8px}.evidence h3{margin-top:0}.evidence p{margin-bottom:0}</style></head><body><header><h1>靈光筆記 2.0</h1><p>找一個你想弄懂的問題，花點時間試試看。</p></header><main id="app"></main><script>const tasks=[{"id":"0-0","category":"創意發明所","title":"如果書包會抱怨","mission":"每天背著書包上學，你有沒有遇過明明帶了東西，卻翻遍整個書包都找不到的情況？書包設計牽涉收納、重量分配和拿取順序，設計師得先知道使用者真正的困擾。 找出書包最不好用的一處，觀察自己連續三天拿取物品的情形，再設計改良版。","hint":"把常用與少用物品分開計時，看看哪種收納順序最省時間。","output":"草圖、紙模型、使用測試","variables":[],"preview":"找出書包最不好用的一處，觀察自己連續三天拿取物品的情形，再設計改良版。","evidence":"書包拿取物品的觀察紀錄、改造前後的草圖","directions":["把常用與少用物品分開計時，看看哪種收納順序最省時間。","哪些物品最難拿取？","隔層位置如何影響使用？"]},{"id":"0-1","category":"創意發明所","title":"三種材料做玩具","mission":"玩具店裡的玩具琳瑯滿目，但好玩的東西一定要用很多零件嗎？試想自己是玩具設計師，手邊只有三種材料，卻要讓玩家願意玩第二次。玩法的巧思往往比華麗外觀更重要。 從紙、橡皮筋、吸管等安全材料中選三種，做一個有明確玩法的玩具，請家人試玩後修改。","hint":"設計兩種難度，觀察初次玩家和熟練玩家各在哪裡卡關。","output":"玩具、試玩影片","variables":[],"preview":"從紙、橡皮筋、吸管等安全材料中選三種，做一個有明確玩法的玩具，請家人試玩後修改。","evidence":"三種材料的選擇理由、試玩後修改的零件","directions":["設計兩種難度，觀察初次玩家和熟練玩家各在哪裡卡關。","材料的特性適合哪種玩法？","如何讓玩法不只靠運氣？"]},{"id":"0-2","category":"創意發明所","title":"不插電提醒器","mission":"出門前忘記帶水壺、睡前忘記整理書包，這些事你是不是也遇過？生活中的提醒不一定需要手機或鬧鐘，物品擺放的位置、顏色甚至機械構造都能成為提醒。 挑一件自己常忘記的事，設計不用電的提醒裝置，連續試用三天。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"模擬趕時間出門的情境，測試提醒器是否仍能發揮作用。","output":"裝置、試用日誌","variables":[],"preview":"挑一件自己常忘記的事，設計不用電的提醒裝置，連續試用三天。","evidence":"提醒器安裝位置、實際提醒成功或失敗的紀錄","directions":["模擬趕時間出門的情境，測試提醒器是否仍能發揮作用。","忘記前通常正在做什麼？","提醒放在哪裡才會被注意？"]},{"id":"0-3","category":"創意發明所","title":"雨天的新用途","mission":"下雨時我們總想躲雨，但雨水也可能是設計的好幫手！從雨傘滴下的水、濕答答的鞋底到陽台積水，選一個你熟悉的現象，想想能不能把麻煩轉變成有用的資源。 觀察雨天生活中一個不方便的地方，設計能利用雨水或雨天特性的物品。","hint":"比較雨量不同時裝置的收集效率，想想容量不足時怎麼處理。","output":"設計圖、模型","variables":[],"preview":"觀察雨天生活中一個不方便的地方，設計能利用雨水或雨天特性的物品。","evidence":"雨天觀察照片、利用雨水的設計草圖","directions":["比較雨量不同時裝置的收集效率，想想容量不足時怎麼處理。","雨水在哪些地方被浪費？","如何避免積水或滑倒？"]},{"id":"0-4","category":"創意發明所","title":"改造教室角落","mission":"教室裡有沒有一個你覺得很可惜的角落？也許堆滿東西，也許明明有空間卻很少人使用。室內設計師除了考慮美觀，還得顧及走動路線、收納和不同人的需要。 選一處教室角落，記錄它現在的用途與困擾，提出兩種改造方案並比較。","hint":"畫出改造前後的平面圖，估算可以增加多少可用空間。","output":"平面圖、模型、提案","variables":[],"preview":"選一處教室角落，記錄它現在的用途與困擾，提出兩種改造方案並比較。","evidence":"角落原貌或手繪圖、改造前後的動線比較","directions":["畫出改造前後的平面圖，估算可以增加多少可用空間。","誰最常經過這個角落？","改造會影響哪些原有用途？"]},{"id":"0-5","category":"創意發明所","title":"未來超市","mission":"嘿！如果有一天超市不再有收銀員，你會怎麼挑商品、付款和處理買錯的東西？科技可以讓購物變快，但不熟悉設備的人也可能遇到麻煩，設計時不能只考慮自己。 假想超市取消收銀台，設計一套購物流程，讓不同年齡的人都能使用。","hint":"比較自助結帳與人工結帳需要的步驟，找出容易出錯的環節。","output":"流程圖、情境演示","variables":[],"preview":"假想超市取消收銀台，設計一套購物流程，讓不同年齡的人都能使用。","evidence":"購物流程圖、模擬顧客遇到的問題","directions":["比較自助結帳與人工結帳需要的步驟，找出容易出錯的環節。","不熟悉科技的人怎麼購物？","停電時有哪些備用方法？"]},{"id":"0-6","category":"創意發明所","title":"一張紙變工具","mission":"一張平凡的紙可以摺、捲、撕，也能利用不同形狀改變硬度。想想生活中有哪些小麻煩能用它解決，例如固定物品、引導水流或整理桌面，不必急著購買新工具。 只用一張紙設計能完成一項生活任務的工具，測試後至少修改一次。","hint":"測試紙工具遇到水或反覆使用後，功能會有什麼變化。","output":"實物、前後比較","variables":[],"preview":"只用一張紙設計能完成一項生活任務的工具，測試後至少修改一次。","evidence":"紙工具原型、實際使用時的缺點與改良","directions":["測試紙工具遇到水或反覆使用後，功能會有什麼變化。","摺疊和捲曲會如何改變紙的功能？","工具用壞後能否快速替換？"]},{"id":"0-7","category":"創意發明所","title":"新節日企劃局","mission":"我們熟悉的節日有不同的由來、食物與慶祝方式。如果由你創造一個節日，你想讓大家記住什麼事情？一個好節日除了好玩，也應該讓不同喜好的人找到參與方式。 設計一個值得大家慶祝的新節日，規劃活動、由來及有限預算，邀請家人評估。","hint":"估算活動需要的時間、人力與材料，找出最值得保留的安排。","output":"海報、活動企劃","variables":[],"preview":"設計一個值得大家慶祝的新節日，規劃活動、由來及有限預算，邀請家人評估。","evidence":"節日活動草案、試問他人後調整的安排","directions":["估算活動需要的時間、人力與材料，找出最值得保留的安排。","節日想紀念什麼價值？","不喜歡熱鬧的人如何參與？"]},{"id":"0-8","category":"創意發明所","title":"長輩需要的小物","mission":"你是否注意過有些日用品對自己來說很好操作，對長輩卻不一定方便？握力、視力與活動能力都可能影響使用經驗。真正貼心的發明要從對方的需求出發，而非自己猜測。 先詢問家中長輩一件日常小困擾，再設計能改善它的物品，不要替對方猜需求。","hint":"比較單手與雙手操作的步驟，找出可以簡化的地方。","output":"訪談摘要、模型","variables":[],"preview":"先詢問家中長輩一件日常小困擾，再設計能改善它的物品，不要替對方猜需求。","evidence":"使用需求紀錄、原型試用與修正","directions":["比較單手與雙手操作的步驟，找出可以簡化的地方。","長輩在哪個操作步驟最不方便？","如何兼顧握持與安全？"]},{"id":"0-9","category":"創意發明所","title":"失敗作品改造","mission":"設計師很少第一次就做出最滿意的作品，失敗的模型反而可能留下重要線索。翻翻自己的舊作品，看看當初哪個構想值得保留、哪個地方讓使用者不方便，給它一次重生機會。 找出自己曾做得不理想的作品，保留原版，分析問題後重新製作。","hint":"把原本的缺點依嚴重程度排序，決定有限時間內優先改善哪一項。","output":"兩版作品、測試紀錄","variables":[],"preview":"找出自己曾做得不理想的作品，保留原版，分析問題後重新製作。","evidence":"舊作品的缺點、改造前後的比較","directions":["把原本的缺點依嚴重程度排序，決定有限時間內優先改善哪一項。","原作品哪部分值得保留？","如何比較改造前後的效果？"]},{"id":"1-0","category":"科學實驗室","title":"紙飛機工程師","mission":"紙飛機看起來簡單，卻和真正飛機一樣受到形狀、空氣阻力及重量分布影響。你可能摺過飛得很遠的飛機，也可能遇過一放手就掉下來的作品。究竟是哪個設計造成差異？ 摺出三種紙飛機，從同一位置試飛，找出影響飛行距離的設計，再改良一次。","hint":"分別記錄飛行距離與偏離目標的程度，看看哪種設計適合不同用途。","output":"試飛影片、數據圖","variables":["機翼折法","紙張、投擲位置與方式","飛行距離（公分）"],"preview":"摺出三種紙飛機，從同一位置試飛，找出影響飛行距離的設計，再改良一次。","evidence":"飛機摺法、各次飛行距離及改良結果","directions":["分別記錄飛行距離與偏離目標的程度，看看哪種設計適合不同用途。","機翼形狀如何影響飛行？","如何固定每次投擲的條件？"]},{"id":"1-1","category":"科學實驗室","title":"紙橋耐重賽","mission":"橋梁每天承受行人和車輛的重量，工程師會利用結構分散力量。薄薄一張紙平放時很容易彎曲，改變形狀後卻可能有不同表現。你能用相同材料找出更耐重的橋面嗎？ 用相同大小的紙搭出三種橋面，逐次增加相同重量的物品，比較承重能力。","hint":"比較橋面承重後的變形量，而不只記錄最後倒塌的重量。","output":"橋模型、承重表","variables":["橋面形狀","紙張、橋墩距離、載重位置","最大承重（克）"],"preview":"用相同大小的紙搭出三種橋面，逐次增加相同重量的物品，比較承重能力。","evidence":"橋面結構照片或草圖、各次承重數據","directions":["比較橋面承重後的變形量，而不只記錄最後倒塌的重量。","橋面哪個位置最先變形？","如何公平比較不同結構？"]},{"id":"1-2","category":"科學實驗室","title":"硬幣上的水滴","mission":"你有注意過水珠停在荷葉或桌面上的樣子嗎？水滴有時會聚在一起，有時又會攤開。硬幣上的小水丘是觀察液體表面現象的好機會，也能讓你練習仔細控制每次滴水的方式。 用滴管在硬幣上逐滴加水，比較不同硬幣表面或液體條件能容納的滴數。","hint":"觀察水滴接近溢出時的輪廓，試著用側面草圖呈現變化。","output":"近照、滴數表","variables":["硬幣表面或液體種類（擇一）","滴管、滴水高度、硬幣大小","溢出前滴數"],"preview":"用滴管在硬幣上逐滴加水，比較不同硬幣表面或液體條件能容納的滴數。","evidence":"滴水方式、各次水滴數與水丘觀察","directions":["觀察水滴接近溢出時的輪廓，試著用側面草圖呈現變化。","滴管高度會影響水丘嗎？","重複測量的結果是否一致？"]},{"id":"1-3","category":"科學實驗室","title":"影子搬家","mission":"早上走進校園和下午放學時，地上的影子可能朝向不同方向。古人曾利用影子的變化判斷時間，現在建築設計也會考慮日照。試著把平常不太注意的影子變成一份觀察資料。 在安全的戶外位置固定一根直立物，每隔一段時間記錄影子的長度與方向。","hint":"將不同日期相同時刻的影子紀錄疊在一起，找出可能的差異。","output":"影子地圖、時間圖","variables":["觀察時間","物體、位置、測量方法","影長（公分）與方向"],"preview":"在安全的戶外位置固定一根直立物，每隔一段時間記錄影子的長度與方向。","evidence":"不同時間的影子位置、日期與測量紀錄","directions":["將不同日期相同時刻的影子紀錄疊在一起，找出可能的差異。","影子長度與方向如何隨時間變化？","陰天時如何處理觀察限制？"]},{"id":"1-4","category":"科學實驗室","title":"冰塊保冷賽","mission":"夏天買冰棒回家，最怕還沒到家就融化。保冷袋、冰桶和包裝材料都在設法減慢熱量傳遞，但不同材料的效果未必和我們想像的一樣。你能利用家裡現有材料做出比較嗎？ 利用家中材料設計三種保冷方式，比較相同冰塊的融化程度，再改良其中一組。","hint":"比較保冷材料包覆完整與留有縫隙的情況，推測熱量從哪裡進入。","output":"保冷裝置、照片、數據圖","variables":["包覆材料","冰塊重量、容器、環境、時間","融水量（毫升）"],"preview":"利用家中材料設計三種保冷方式，比較相同冰塊的融化程度，再改良其中一組。","evidence":"融化前的預測、各組實測數據與改良結果","directions":["比較保冷材料包覆完整與留有縫隙的情況，推測熱量從哪裡進入。","材料厚度是否需要一致？","如何量化冰塊融化程度？"]},{"id":"1-5","category":"科學實驗室","title":"一張紙的承重","mission":"紙杯、紙筒和紙盒看似脆弱，卻常被用來保護商品。結構的形狀會影響受力方式，這也是建築柱子和包裝設計的重要概念。試試看相同一張紙能承受多少重量。 用相同大小的紙做不同形狀的柱子，逐次增加重量，找出最耐重的形狀。","hint":"比較紙柱接縫朝向不同位置時的變形方式，找出較弱的部位。","output":"模型、承重紀錄","variables":["柱子形狀","紙張、柱高、載重位置","最大承重（克）"],"preview":"用相同大小的紙做不同形狀的柱子，逐次增加重量，找出最耐重的形狀。","evidence":"紙張形狀、承重數據及變形情形","directions":["比較紙柱接縫朝向不同位置時的變形方式，找出較弱的部位。","紙柱的截面形狀有何差異？","重量放置位置如何影響結果？"]},{"id":"1-6","category":"科學實驗室","title":"植物在哪長得好","mission":"窗邊和室內深處的植物，可能長出不同樣子的葉片。植物需要光，但不同種類的需求也不一樣。這次不要只憑印象判斷哪裡適合種植，讓連續幾天的觀察提供線索。 選相同種類的幼苗，放在光照不同但安全的位置，連續觀察至少一週。","hint":"記錄葉片顏色與新葉出現時間，看看高度以外的生長變化。","output":"植物日誌、照片","variables":["光照位置","植物種類、土壤、水量、容器","高度（公分）、葉片數"],"preview":"選相同種類的幼苗，放在光照不同但安全的位置，連續觀察至少一週。","evidence":"種植位置、連續觀察紀錄與生長差異","directions":["記錄葉片顏色與新葉出現時間，看看高度以外的生長變化。","如何區分光照與澆水的影響？","哪些生長指標值得記錄？"]},{"id":"1-7","category":"科學實驗室","title":"橡皮筋動力車","mission":"橡皮筋拉伸或扭轉後能儲存能量，放開時可以帶動物體。玩具車的設計還涉及摩擦、輪子和重量分配。你能不能讓小車跑得更遠，同時找出真正造成差異的原因？ 用紙板與橡皮筋做小車，改變一項設計並比較行進距離，不朝人發射。","hint":"記錄小車偏離直線的程度，檢查左右輪是否對稱。","output":"小車、測試影片","variables":["橡皮筋圈數或輪徑（擇一）","車身、地面、起點","行進距離（公分）"],"preview":"用紙板與橡皮筋做小車，改變一項設計並比較行進距離，不朝人發射。","evidence":"車子構造、各次行駛距離與調整","directions":["記錄小車偏離直線的程度，檢查左右輪是否對稱。","輪子與車軸如何影響滑行？","怎樣控制橡皮筋儲存的能量？"]},{"id":"1-8","category":"科學實驗室","title":"隔音小實驗","mission":"住家靠近馬路或教室旁有人說話時，聲音可能影響休息和學習。隔音窗、牆面材料和耳罩各有不同作用。利用小盒子就能開始比較材料對聲音傳遞的影響。 用盒子與不同安全材料包覆固定音源，在相同距離比較聲音大小。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較材料包覆完整與留有縫隙的情況，找出聲音可能傳出的路徑。","output":"裝置、相對音量表","variables":["包覆材料","音源音量、距離、盒子","相對音量（同一裝置測量）"],"preview":"用盒子與不同安全材料包覆固定音源，在相同距離比較聲音大小。","evidence":"隔音裝置、各材料的比較紀錄","directions":["比較材料包覆完整與留有縫隙的情況，找出聲音可能傳出的路徑。","聲源和測量位置如何固定？","隔音材料的厚度是否影響比較？"]},{"id":"1-9","category":"科學實驗室","title":"讓球彈得更高","mission":"籃球在球場上彈得很高，掉在草地上卻可能有不同表現。球和地面碰撞時，能量會以不同方式轉移。這次試著像運動器材研究員一樣，用測量代替單純的目測。 從固定高度放下同一顆球，比較不同地面上的反彈高度。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"用背景刻度和慢動作影片確認最高點，評估目測可能造成的誤差。","output":"影片、比較圖","variables":["地面材質","球、落下高度、測量方法","反彈高度（公分）"],"preview":"從固定高度放下同一顆球，比較不同地面上的反彈高度。","evidence":"球與地面條件、各次反彈高度","directions":["用背景刻度和慢動作影片確認最高點，評估目測可能造成的誤差。","如何固定球的落下高度？","反彈高度能說明哪些能量變化？"]},{"id":"2-0","category":"生活調查局","title":"學校被忽略的角落","mission":"每天經過的校園其實藏著許多平常不會注意的空間，例如樓梯旁、花圃邊或走廊轉角。這些地方可能有特殊功能，也可能因為動線或設施而很少人使用。 走訪校園三處平常少注意的角落，觀察用途與使用者，提出一項改善建議。","hint":"分別記錄經過與停留的人數，判斷空間是通道還是活動場所。","output":"觀察地圖、速寫","variables":[],"preview":"走訪校園三處平常少注意的角落，觀察用途與使用者，提出一項改善建議。","evidence":"親自觀察的角落位置、用途與改善理由","directions":["分別記錄經過與停留的人數，判斷空間是通道還是活動場所。","角落目前有哪些用途？","哪些改善不會妨礙通行？"]},{"id":"2-1","category":"生活調查局","title":"校園哪裡最熱","mission":"同一所學校裡，樹蔭下、操場旁和水泥走廊的感受可能完全不同。都市規劃也會面對類似的熱環境問題。試著用一致的測量方式找出校園裡比較舒適的位置。 選三個校園位置，在相近時間測量氣溫或地表溫度，分析遮蔭與材質的關係。","hint":"比較同一地點不同天的讀值，記下天氣與測量方式造成的限制。","output":"地圖、溫度表","variables":[],"preview":"選三個校園位置，在相近時間測量氣溫或地表溫度，分析遮蔭與材質的關係。","evidence":"測量地點、時間、溫度及遮蔭條件","directions":["比較同一地點不同天的讀值，記下天氣與測量方式造成的限制。","遮蔭和地面材質有何差異？","不同時間的測量結果能否直接比較？"]},{"id":"2-2","category":"生活調查局","title":"商品為什麼擺這裡","mission":"逛商店時，你有沒有發現有些商品總是出現在最容易看見的位置？貨架配置可能與購物習慣、商品尺寸及促銷安排有關。先觀察實際情況，再提出合理解釋。 在家人陪同下觀察商店貨架，記錄同類商品的位置與價格，提出可能的陳列理由。","hint":"比較同類商品的價格與貨架位置，檢查最顯眼的商品是否最便宜。","output":"貨架示意圖、比較表","variables":[],"preview":"在家人陪同下觀察商店貨架，記錄同類商品的位置與價格，提出可能的陳列理由。","evidence":"實際貨架配置草圖、觀察與推測的區別","directions":["比較同類商品的價格與貨架位置，檢查最顯眼的商品是否最便宜。","視線高度如何影響商品位置？","有哪些證據支持你的推測？"]},{"id":"2-3","category":"生活調查局","title":"家裡常忘記的事","mission":"忘記帶東西不一定只是粗心，有時是出門太匆忙、物品放錯位置或正在做另一件事。把忘記事情的情境記下來，也許能找出比責怪自己更有效的改善方式。 記錄自己一週忘記事情的時間與情境，找出規律，試用一種提醒方法。","hint":"將忘記事件依物品、時間與活動分類，找出最常出現的組合。","output":"匿名日誌、改善紀錄","variables":[],"preview":"記錄自己一週忘記事情的時間與情境，找出規律，試用一種提醒方法。","evidence":"忘記事件的情境紀錄、試行改善方法","directions":["將忘記事件依物品、時間與活動分類，找出最常出現的組合。","忘記事件集中在哪個時段？","改變物品位置能否減少遺忘？"]},{"id":"2-4","category":"生活調查局","title":"排隊要多久","mission":"排隊買餐點時，有時看起來很長的隊伍反而移動得很快。服務窗口數量、每位顧客的需求和尖峰時段都可能影響等待時間。這也是商店和公共服務設計會研究的問題。 選一個安全的排隊場所，記錄不同時段等待時間，分析可能影響速度的因素。","hint":"記錄每位顧客的服務時間，看看少數耗時較長的情況如何影響平均值。","output":"時間表、圖表","variables":[],"preview":"選一個安全的排隊場所，記錄不同時段等待時間，分析可能影響速度的因素。","evidence":"匿名排隊觀察的時間與人數紀錄","directions":["記錄每位顧客的服務時間，看看少數耗時較長的情況如何影響平均值。","隊伍長度與等待時間有何關係？","服務速度如何影響結果？"]},{"id":"2-5","category":"生活調查局","title":"超商飲料調查","mission":"飲料瓶上的大字可能強調果汁、茶葉或低糖，但真正比較時還需要看容量與營養標示。你可以像消費者研究員一樣，找出廣告文字以外的重要資訊。 比較三種同容量飲料的營養標示、價格與成分，說明不同需求下怎麼選。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較整瓶喝完與只喝一份時的糖量，找出標示容易誤解的地方。","output":"商品比較表","variables":[],"preview":"比較三種同容量飲料的營養標示、價格與成分，說明不同需求下怎麼選。","evidence":"三款飲料的實際標示與換算比較","directions":["比較整瓶喝完與只喝一份時的糖量，找出標示容易誤解的地方。","每百毫升的糖量如何比較？","容量與價格如何影響選擇？"]},{"id":"2-6","category":"生活調查局","title":"一天的垃圾","mission":"一天之中，我們可能丟掉包裝袋、衛生紙或食物剩餘物。垃圾車把它們載走之後，處理仍需要人力與資源。從自己的生活開始觀察，看看哪些垃圾原本就能避免。 記錄家中一天的垃圾種類與數量，查詢當地分類方式，提出減量方法。不要翻找危險垃圾。","hint":"估算各類垃圾的重量或體積，找出減量效果最大的項目。","output":"分類圖、減量計畫","variables":[],"preview":"記錄家中一天的垃圾種類與數量，查詢當地分類方式，提出減量方法。不要翻找危險垃圾。","evidence":"自己一天的垃圾分類紀錄與減量構想","directions":["估算各類垃圾的重量或體積，找出減量效果最大的項目。","哪些垃圾可以在購買前避免？","如何安全記錄而不翻找垃圾？"]},{"id":"2-7","category":"生活調查局","title":"訪問一種職業","mission":"你熟悉的職業也許有許多外人看不見的工作，例如準備、協調、處理突發狀況。光看職業名稱很難了解真正的工作內容，訪談能幫助我們修正原本的想像。 選一種不熟悉的職業，經對方同意後訪問或查閱公開訪談，比較想像與實際工作。","hint":"請受訪者舉一個需要臨場判斷的工作案例，分析需要哪些能力。","output":"職業介紹、匿名訪談摘要","variables":[],"preview":"選一種不熟悉的職業，經對方同意後訪問或查閱公開訪談，比較想像與實際工作。","evidence":"經同意的匿名訪談重點、原先想法與新發現","directions":["請受訪者舉一個需要臨場判斷的工作案例，分析需要哪些能力。","工作有哪些外人看不到的部分？","訪談後哪些印象改變了？"]},{"id":"2-8","category":"生活調查局","title":"校園人氣地圖","mission":"下課時有些地方總是聚集很多人，有些空間卻很安靜。人氣可能受到遮蔭、遊戲設備、位置和同伴習慣影響。你能畫出一張有資料支持的校園使用地圖嗎？ 觀察校園不同空間的使用情形，畫出人氣地圖，分析不同時段的差異。","hint":"分開記錄經過與實際停留的人，避免把必經路線誤認為熱門場所。","output":"地圖、觀察表","variables":[],"preview":"觀察校園不同空間的使用情形，畫出人氣地圖，分析不同時段的差異。","evidence":"不同地點的匿名人數紀錄與地圖","directions":["分開記錄經過與實際停留的人，避免把必經路線誤認為熱門場所。","不同時段的人氣地點相同嗎？","人數多是否代表每個人都喜歡？"]},{"id":"2-9","category":"生活調查局","title":"大家真的都這麼想","mission":"大家都喜歡某種遊戲、大家都覺得某項規定很麻煩，這類說法常出現在聊天中。但我們聽到的幾個意見未必代表所有人。試著用不帶暗示的問題蒐集資料。 選一個生活中的常見說法，設計不誘導答案的小調查，比較結果與原先猜測。","hint":"比較開放式與選擇式問題得到的資訊，看看哪些意見容易被漏掉。","output":"匿名統計、圖表","variables":[],"preview":"選一個生活中的常見說法，設計不誘導答案的小調查，比較結果與原先猜測。","evidence":"匿名調查題目、實際統計及樣本限制","directions":["比較開放式與選擇式問題得到的資訊，看看哪些意見容易被漏掉。","問題措辭會不會暗示答案？","受訪者是否足以代表其他人？"]},{"id":"3-0","category":"心情練習所","title":"明明不是我的錯","mission":"爭執發生時，我們往往先注意對方做錯了什麼，卻不容易看見自己的反應如何影響事情發展。即使對方先挑起衝突，我們仍能選擇保護自己又不讓情況惡化的做法。 回想或虛構一次雙方都覺得自己沒錯的爭執，畫出事件經過，找出能避免升高衝突的做法。","hint":"找出真正讓你不開心的話或舉動，區分對方做的事與你對他的推測，再想想可以怎麼表達不滿。","output":"漫畫、情境演示","variables":[],"preview":"回想或虛構一次雙方都覺得自己沒錯的爭執，畫出事件經過，找出能避免升高衝突的做法。","evidence":"虛構衝突的兩種反應、演練後的差異","directions":["找出真正讓你不開心的話或舉動，區分對方做的事與你對他的推測，再想想可以怎麼表達不滿。","哪些反應會讓衝突升高？","如何保護自己又不傷害別人？"]},{"id":"3-1","category":"心情練習所","title":"失敗收藏盒","mission":"失敗有時讓人很想把作品藏起來，但它也可能告訴我們原本的計畫哪裡需要調整。運動員、發明家和研究者都會利用失敗留下的資訊安排下一次嘗試。 選一次願意分享的小失敗，整理原先期待、實際結果與後來學到的事，設計下一次嘗試。","hint":"把失敗原因分成準備、方法與意外狀況，找出自己能改變的部分。","output":"手帳、作品前後比較","variables":[],"preview":"選一次願意分享的小失敗，整理原先期待、實際結果與後來學到的事，設計下一次嘗試。","evidence":"一項失敗經驗或虛構案例、下一次嘗試的調整","directions":["把失敗原因分成準備、方法與意外狀況，找出自己能改變的部分。","失敗提供了什麼資訊？","下一次可以先改哪個步驟？"]},{"id":"3-2","category":"心情練習所","title":"朋友一直求幫忙","mission":"朋友請你幫忙時，答應可能讓對方開心，但如果每次都由你完成，自己也可能沒有時間。真正的合作需要考慮雙方需求，拒絕或協商也可以是友善的選擇。 設計三種朋友請你幫忙的情境，比較答應、拒絕與協商的後果，和家人演練。","hint":"比較答應、拒絕與只提供部分協助的結果，看看哪種做法能兼顧雙方時間。","output":"對話漫畫、角色演示","variables":[],"preview":"設計三種朋友請你幫忙的情境，比較答應、拒絕與協商的後果，和家人演練。","evidence":"兩種求助情境的回應演練、界線調整","directions":["比較答應、拒絕與只提供部分協助的結果，看看哪種做法能兼顧雙方時間。","幫忙與代做的界線在哪裡？","怎樣拒絕仍能維持友善？"]},{"id":"3-3","category":"心情練習所","title":"被打斷的時候","mission":"正在分享一個好點子時突然被打斷，可能讓人覺得不被尊重。不過對方也可能沒有注意到你還沒說完。如何讓自己的需求被聽見，又不必立刻把對方當成敵人？ 觀察或虛構一次說話被打斷的情境，試寫不同反應並演練哪種能表達需求。","hint":"試著用平靜與不耐煩的語氣說同一句話，比較對方可能的反應。","output":"對話卡、影片","variables":[],"preview":"觀察或虛構一次說話被打斷的情境，試寫不同反應並演練哪種能表達需求。","evidence":"被打斷情境的兩種說法、演練後的感受","directions":["試著用平靜與不耐煩的語氣說同一句話，比較對方可能的反應。","對方可能有哪些不同意圖？","如何清楚表達還沒說完？"]},{"id":"3-4","category":"心情練習所","title":"拖到最後一天","mission":"有些任務明明不難，我們卻一直不想開始。原因可能是第一步不清楚、擔心做不好或被其他有趣的事吸引。找到真正的阻礙，比只提醒自己要努力更有幫助。 記錄一項容易拖延的小任務，找出開始前的阻礙，試行一個方法三天。","hint":"記錄開始前與開始兩分鐘後的感受，看看原先預期的困難是否真的出現。","output":"計畫表、試行紀錄","variables":[],"preview":"記錄一項容易拖延的小任務，找出開始前的阻礙，試行一個方法三天。","evidence":"任務開始前的阻礙、試行方法與結果","directions":["記錄開始前與開始兩分鐘後的感受，看看原先預期的困難是否真的出現。","不開始的原因是什麼？","如何把第一步變得容易？"]},{"id":"3-5","category":"心情練習所","title":"一句話兩種意思","mission":"同一句話搭配不同表情、語氣或前後情境，可能讓人產生完全不同的理解。聊天訊息少了聲音和表情，更容易發生誤會。這次來研究語言以外的線索。 挑三句可能被誤會的日常用語，設計不同語氣與情境，比較聽者可能的理解。","hint":"替同一句話設計兩個不同的前後情境，找出造成誤會的關鍵線索。","output":"漫畫、配音影片","variables":[],"preview":"挑三句可能被誤會的日常用語，設計不同語氣與情境，比較聽者可能的理解。","evidence":"同一句話的兩種語氣演練、理解差異","directions":["替同一句話設計兩個不同的前後情境，找出造成誤會的關鍵線索。","語氣和表情如何改變意思？","不確定時如何確認？"]},{"id":"3-6","category":"心情練習所","title":"輸掉遊戲以後","mission":"遊戲輸掉時，失望或生氣都是可能出現的感受，但我們接下來的行動會影響隊友與對手。想像自己還要和同一群人玩下一場，什麼樣的反應能保留合作的機會？ 設計一個輸掉遊戲的情境，比較不同反應對自己、隊友和下一場遊戲的影響。","hint":"區分對結果失望與對隊友生氣的原因，思考各自適合的處理方式。","output":"情境卡、短劇","variables":[],"preview":"設計一個輸掉遊戲的情境，比較不同反應對自己、隊友和下一場遊戲的影響。","evidence":"輸掉遊戲的虛構情境、兩種反應的後果","directions":["區分對結果失望與對隊友生氣的原因，思考各自適合的處理方式。","輸掉後哪些行動仍由自己決定？","如何讓隊友願意再合作？"]},{"id":"3-7","category":"心情練習所","title":"別人不想聽建議","mission":"看見別人遇到問題，我們可能很快想到解法，卻發現對方根本不想聽。提供建議之前了解對方想要什麼，能減少好意變成壓力的情況。 找一個別人不接受建議的虛構情境，分析對方可能的理由，練習先詢問再提供意見。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較直接給解法與先聽完對方說法的對話，看看哪種回應更符合需求。","output":"對話圖、角色演練","variables":[],"preview":"找一個別人不接受建議的虛構情境，分析對方可能的理由，練習先詢問再提供意見。","evidence":"提供建議前後的角色演練、對方可能的需求","directions":["比較直接給解法與先聽完對方說法的對話，看看哪種回應更符合需求。","對方需要建議還是陪伴？","如何先詢問再提供幫助？"]},{"id":"3-8","category":"心情練習所","title":"情緒警報器","mission":"情緒變強之前，身體有時會先出現訊號，例如肩膀緊繃、心跳變快或說話聲變大。若能提早察覺，就可能有更多時間選擇下一步，而不是等到事情失控才處理。 觀察自己在輕微煩躁時的身體訊號，設計一張提醒卡，試用並修正。","hint":"畫出情緒從平靜到激動的變化刻度，替不同程度安排適合的行動。","output":"提醒卡、試用日誌","variables":[],"preview":"觀察自己在輕微煩躁時的身體訊號，設計一張提醒卡，試用並修正。","evidence":"自己的情緒訊號圖或虛構案例、可行的應對方式","directions":["畫出情緒從平靜到激動的變化刻度，替不同程度安排適合的行動。","身體最早出現什麼訊號？","在哪個時刻採取行動最有用？"]},{"id":"3-9","category":"心情練習所","title":"有些話要不要說","mission":"誠實很重要，但表達真話也需要考慮目的、時機和對方的感受。指出作品缺點與故意讓人難堪並不相同。你能不能設計既清楚又尊重人的表達方式？ 設計三個想說真話卻怕傷人的情境，比較直接說、換方式說與暫時不說。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較公開指出問題與私下提醒的效果，想想對方在哪種場合較能接受。","output":"情境漫畫、對話卡","variables":[],"preview":"設計三個想說真話卻怕傷人的情境，比較直接說、換方式說與暫時不說。","evidence":"兩種表達方式的情境演練與比較","directions":["比較公開指出問題與私下提醒的效果，想想對方在哪種場合較能接受。","說出真話的目的是什麼？","如何選擇合適時機與措辭？"]},{"id":"4-0","category":"思辨選擇題","title":"公平就是一樣多嗎","mission":"分點心看似簡單，但有人可能沒吃早餐，有人付出了更多準備工作，也有人有飲食限制。平均分配、依需求分配和依貢獻分配各有理由，公平未必只有一種答案。 假設10份點心要分給5人，但需求和付出不同。設計至少三種分配原則，用生活中的另一個例子測試它們。","hint":"設計一個資源不足的例外情境，檢查自己選擇的公平原則是否仍適用。","output":"分配遊戲、比較表、觀點短文","variables":[],"preview":"假設10份點心要分給5人，但需求和付出不同。設計至少三種分配原則，用生活中的另一個例子測試它們。","evidence":"兩種分配方案、遇到例外時的調整理由","directions":["設計一個資源不足的例外情境，檢查自己選擇的公平原則是否仍適用。","平均分配與依需求分配有何差異？","遇到特殊需求時如何調整？"]},{"id":"4-1","category":"思辨選擇題","title":"安全可以限制自由嗎","mission":"遊戲場需要安全規則，但如果為了避免所有受傷而禁止所有活動，學生也可能失去運動與探索的機會。制定規則時，需要同時考慮風險大小和限制帶來的影響。 假設學校為了安全禁止所有下課奔跑，分析學生、老師及受傷風險較高者的需求，提出替代規則。","hint":"比較事故發生的可能性與嚴重程度，判斷哪些限制值得採用。","output":"規則提案、利弊表","variables":[],"preview":"假設學校為了安全禁止所有下課奔跑，分析學生、老師及受傷風險較高者的需求，提出替代規則。","evidence":"具體安全規則、不同風險與替代方案","directions":["比較事故發生的可能性與嚴重程度，判斷哪些限制值得採用。","限制能降低哪些風險？","有沒有更少限制的替代方案？"]},{"id":"4-2","category":"思辨選擇題","title":"善意的謊言","mission":"為了準備驚喜而保密，和為了避免被責備而隱瞞事情，可能都被稱為善意的謊言。但不同情境中的動機、後果與他人的知情權並不相同。 蒐集或虛構三種善意謊言情境，比較說真話與隱瞞的短期、長期影響，再提出自己的判斷原則。","hint":"想像謊言被揭穿後的情況，提出既能照顧感受又不隱瞞重要資訊的說法。","output":"案例比較、觀點影片","variables":[],"preview":"蒐集或虛構三種善意謊言情境，比較說真話與隱瞞的短期、長期影響，再提出自己的判斷原則。","evidence":"兩個虛構案例、不同說法的後果比較","directions":["想像謊言被揭穿後的情況，提出既能照顧感受又不隱瞞重要資訊的說法。","謊言會影響誰的知情權？","短期好處與長期信任如何取捨？"]},{"id":"4-3","category":"思辨選擇題","title":"成績代表努力嗎","mission":"考試分數能提供某些學習資訊，卻不一定完整呈現一個人的起點、努力方式和進步程度。假如兩位同學的準備條件不同，你會怎麼理解他們的成績？ 比較幾個虛構學生的準備時間、起點與測驗結果，討論成績能說明什麼、不能說明什麼。","hint":"比較同一學生前後兩次表現與不同學生的分數，看看兩種比較各能說明什麼。","output":"比較圖、評量提案","variables":[],"preview":"比較幾個虛構學生的準備時間、起點與測驗結果，討論成績能說明什麼、不能說明什麼。","evidence":"兩個不同學習條件的案例、評量方式比較","directions":["比較同一學生前後兩次表現與不同學生的分數，看看兩種比較各能說明什麼。","起點不同如何影響分數？","還有哪些方式能呈現進步？"]},{"id":"4-4","category":"思辨選擇題","title":"每個人都該幫忙嗎","mission":"班級活動需要有人搬材料、整理場地或協助同學，但每個人的時間與能力不同。自願參加可能尊重選擇，固定分工則可能比較容易確保事情完成。 假設班級需要志工完成活動，設計自願、輪流及強制分工三種方案，分析各方負擔。","hint":"設計有人暫時無法參與的情境，思考如何調整分工而不讓其他人負擔過重。","output":"分工方案、辯論紀錄","variables":[],"preview":"假設班級需要志工完成活動，設計自願、輪流及強制分工三種方案，分析各方負擔。","evidence":"不同分工方案、受影響者的需求","directions":["設計有人暫時無法參與的情境，思考如何調整分工而不讓其他人負擔過重。","自願與固定分工各有何優缺點？","能力不同時如何分配責任？"]},{"id":"4-5","category":"思辨選擇題","title":"AI寫作業算作弊嗎","mission":"AI可以解釋難懂的知識，也能快速產生文章或圖片。但當作業目的是練習自己的思考與表達時，直接交出AI作品可能讓學習機會消失。 比較AI解釋知識、提供靈感、修改初稿及代寫作業四種用法，依不同學習目標提出使用原則。","hint":"比較AI提供提示、修改文章與直接完成作品三種情境，說明各自保留了哪些學習機會。","output":"使用守則、案例表","variables":[],"preview":"比較AI解釋知識、提供靈感、修改初稿及代寫作業四種用法，依不同學習目標提出使用原則。","evidence":"兩種AI使用方式的實例、自己訂出的界線","directions":["比較AI提供提示、修改文章與直接完成作品三種情境，說明各自保留了哪些學習機會。","哪些AI協助能保留自己的思考？","如何判斷作品是否仍屬於自己？"]},{"id":"4-6","category":"思辨選擇題","title":"少數意見要聽嗎","mission":"投票是常見的決策方式，但票數少的人也可能有重要需求。例如大多數人想吃某種食物，少數人卻有過敏問題。喜好與基本安全需要用不同方式考量。 模擬班級投票決定活動，設計一個少數人無法參加的情境，找出兼顧效率與權益的決策方法。","hint":"設計投票前蒐集意見的方式，看看是否能在表決前找到兼顧需求的方案。","output":"決策流程、角色觀點卡","variables":[],"preview":"模擬班級投票決定活動，設計一個少數人無法參加的情境，找出兼顧效率與權益的決策方法。","evidence":"多數決的案例、少數需求與修正方案","directions":["設計投票前蒐集意見的方式，看看是否能在表決前找到兼顧需求的方案。","少數人的需求與喜好有何差異？","何時應修改多數決結果？"]},{"id":"4-7","category":"思辨選擇題","title":"獎勵讓人更好嗎","mission":"得到獎勵可能讓人更願意參與活動，但也可能讓人只在有獎品時才行動。不同人、不同任務和獎勵方式可能帶來不同效果，不能只憑一次經驗下結論。 比較有獎勵與無獎勵的助人情境，找公開資料或匿名訪談，區分行為增加與動機改變。","hint":"比較獎勵努力、進步與結果三種制度，預測各自可能鼓勵的行為。","output":"證據表、觀點短文","variables":[],"preview":"比較有獎勵與無獎勵的助人情境，找公開資料或匿名訪談，區分行為增加與動機改變。","evidence":"兩種獎勵情境、可能的行為差異","directions":["比較獎勵努力、進步與結果三種制度，預測各自可能鼓勵的行為。","獎勵停止後行為可能如何改變？","不同任務適合相同獎勵嗎？"]},{"id":"4-8","category":"思辨選擇題","title":"犯錯值得第二次機會嗎","mission":"每個人都有可能犯錯，但不同錯誤造成的傷害和風險並不相同。給予改正機會、要求補救與保護受影響的人，可以同時成為考量。 設計三種嚴重程度不同的虛構犯錯情境，分析第二次機會、補救責任與受影響者的安全。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"設計逐步恢復信任的條件，說明如何確認改正真的發生。","output":"案例卡、判斷原則","variables":[],"preview":"設計三種嚴重程度不同的虛構犯錯情境，分析第二次機會、補救責任與受影響者的安全。","evidence":"不同錯誤案例、補救與保護措施","directions":["設計逐步恢復信任的條件，說明如何確認改正真的發生。","錯誤造成的影響有多大？","如何兼顧補救與再次犯錯的風險？"]},{"id":"4-9","category":"思辨選擇題","title":"規則本身不公平","mission":"規則通常有原本想解決的問題，但實際執行後也可能讓某些人承受不合理的負擔。修改規則之前，需要先理解它的目的，再比較新方案可能帶來的影響。 找一條虛構或公開規則，分析它原本的目的、可能的不公平與修改後的副作用，提出可行修正。","hint":"比較文字相同但執行結果不同的案例，找出規則需要調整的條件。","output":"修法提案、正反論證","variables":[],"preview":"找一條虛構或公開規則，分析它原本的目的、可能的不公平與修改後的副作用，提出可行修正。","evidence":"原規則的目的、修改方案及可能副作用","directions":["比較文字相同但執行結果不同的案例，找出規則需要調整的條件。","原規則想解決什麼問題？","修改後誰可能受到不利影響？"]},{"id":"5-0","category":"世界探險家","title":"消失的老行業","mission":"以前街上常見的修鞋、磨刀或其他手藝工作，可能因為商品製造與生活習慣改變而減少。有些職業並沒有完全消失，而是換了一種方式繼續存在。 選一種逐漸消失的行業，查找不同年代的公開資料，分析技術與生活需求如何改變工作。","hint":"比較同一種工作過去與現在的工具、服務對象及收入來源，找出轉型的原因。","output":"時間軸、職業小展覽","variables":[],"preview":"選一種逐漸消失的行業，查找不同年代的公開資料，分析技術與生活需求如何改變工作。","evidence":"老行業的公開資料或匿名訪談、古今工作方式比較","directions":["比較同一種工作過去與現在的工具、服務對象及收入來源，找出轉型的原因。","哪些科技改變了老行業？","哪些技藝仍有保留價值？"]},{"id":"5-1","category":"世界探險家","title":"沒有紅綠燈的城市","mission":"嘿！生活中隨處可見的紅綠燈，其實是為了協調不同方向的交通需求。如果城市沒有紅綠燈，行人、汽車和自行車要如何安全通過路口？不同地區可能採用不同設計。 研究紅綠燈、圓環與行人設施的用途，設計沒有紅綠燈的虛構路口並分析風險。","hint":"比較尖峰與離峰時段的路口需求，思考同一設計是否都適用。","output":"路口模型、交通圖","variables":[],"preview":"研究紅綠燈、圓環與行人設施的用途，設計沒有紅綠燈的虛構路口並分析風險。","evidence":"兩種路口設計的資料來源、交通動線草圖","directions":["比較尖峰與離峰時段的路口需求，思考同一設計是否都適用。","圓環與號誌路口有何差異？","行人和車輛的需求如何兼顧？"]},{"id":"5-2","category":"世界探險家","title":"衣服走過幾個國家","mission":"衣服上的標籤可能寫著製造地，但棉花、布料、染整與縫製不一定都在同一個地方完成。一件平凡的衣服背後，可能有一條跨越多國的生產路線。 查看一件衣服的產地與材質標示，查找原料、製造、運輸可能經過的地區，標示已知與未知。","hint":"找出運輸、加工與販售各階段可能增加的成本，理解衣服價格的形成。","output":"世界地圖、供應鏈圖","variables":[],"preview":"查看一件衣服的產地與材質標示，查找原料、製造、運輸可能經過的地區，標示已知與未知。","evidence":"衣物標籤與公開生產資料、可確認及未知的路線","directions":["找出運輸、加工與販售各階段可能增加的成本，理解衣服價格的形成。","原料產地與製造地有何不同？","哪些生產環節難以追查？"]},{"id":"5-3","category":"世界探險家","title":"百年前的學校","mission":"一百年前的小學生如何上課、寫字和到校？當時的設備、課程與生活條件可能和今天很不同。老照片和歷史資料能幫助我們理解學校如何隨時代改變。 找兩種百年前學校生活的史料，與今天比較課程、設備或規則，說明差異與可能原因。","hint":"比較不同年代的課表或教材，找出教育目標的變化。","output":"古今對照、時間軸","variables":[],"preview":"找兩種百年前學校生活的史料，與今天比較課程、設備或規則，說明差異與可能原因。","evidence":"歷史照片或文獻來源、古今校園比較","directions":["比較不同年代的課表或教材，找出教育目標的變化。","當時的學習工具有哪些？","不同家庭的就學機會是否相同？"]},{"id":"5-4","category":"世界探險家","title":"食物跨海旅行","mission":"餐桌上的馬鈴薯、番茄或其他食材，可能曾經跨越海洋才來到今天的生活。食物的傳播與貿易、移民、氣候及飲食文化都有關係。 選一種常吃的食物，追查它的原產地、傳播與在臺灣的變化，核對至少兩個來源。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"追查食材名稱在不同語言中的變化，看看是否能找到傳播線索。","output":"食物旅行地圖","variables":[],"preview":"選一種常吃的食物，追查它的原產地、傳播與在臺灣的變化，核對至少兩個來源。","evidence":"食材傳播資料來源、自己繪製的旅行路線","directions":["追查食材名稱在不同語言中的變化，看看是否能找到傳播線索。","食材如何適應新地區的氣候？","飲食文化如何因交流而改變？"]},{"id":"5-5","category":"世界探險家","title":"AI成為同學","mission":"如果未來教室裡有能回答問題的AI助手，學生和老師的工作會怎麼改變？科技能協助整理資訊，但判斷正確性、理解他人和實際操作仍有重要價值。 研究AI在學習中的兩種實際用途，設計未來教室的一天，說明哪些工作仍需要人判斷。","hint":"設計AI回答錯誤的教室情境，思考學生可以如何查證與修正。","output":"未來教室漫畫、簡報","variables":[],"preview":"研究AI在學習中的兩種實際用途，設計未來教室的一天，說明哪些工作仍需要人判斷。","evidence":"AI教室的情境設計、人與科技的分工理由","directions":["設計AI回答錯誤的教室情境，思考學生可以如何查證與修正。","哪些學習工作適合AI協助？","哪些能力仍需要親自練習？"]},{"id":"5-6","category":"世界探險家","title":"城市為什麼種樹","mission":"夏天走在有樹蔭的街道和沒有遮蔭的道路上，感受可能差很多。城市種樹除了美觀，還涉及降溫、生態、道路安全和維護成本。 比較城市樹木的遮蔭、降溫、生態與維護需求，觀察附近安全地點並提出種樹建議。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較不同樹種的樹冠大小與生長需求，思考哪些適合狹窄街道。","output":"城市設計圖、觀察紀錄","variables":[],"preview":"比較城市樹木的遮蔭、降溫、生態與維護需求，觀察附近安全地點並提出種樹建議。","evidence":"城市樹木的公開資料、不同街道設計比較","directions":["比較不同樹種的樹冠大小與生長需求，思考哪些適合狹窄街道。","樹蔭與蒸散如何影響環境？","種樹有哪些維護與空間限制？"]},{"id":"5-7","category":"世界探險家","title":"災害改變了什麼","mission":"地震、洪水或颱風可能改變一座城市的建築、交通和防災制度。研究災害歷史不只是記住發生日期，更重要的是理解人們如何從經驗中改善生活環境。 選一場歷史自然災害，查閱官方或博物館資料，整理災前、災後與防災措施的改變。","hint":"找出一項防災措施實施前後的資料，判斷它解決了哪些問題。","output":"時間軸、防災海報","variables":[],"preview":"選一場歷史自然災害，查閱官方或博物館資料，整理災前、災後與防災措施的改變。","evidence":"災害前後的公開資料、制度或環境改變的證據","directions":["找出一項防災措施實施前後的資料，判斷它解決了哪些問題。","災害前後有哪些具體改變？","哪些防災措施來自過去經驗？"]},{"id":"5-8","category":"世界探險家","title":"地圖沒說的故事","mission":"捷運圖可能把站與站畫得很整齊，地形圖卻呈現山脈和高度。地圖不是把所有事物原樣畫下來，而是依照用途選擇資訊，因此閱讀地圖也需要理解它的目的。 比較同一地區的兩種公開地圖，例如交通圖與地形圖，分析各自呈現與省略的資訊。","hint":"比較同一地點的交通圖與地形圖，找出各自適合回答的問題。","output":"自製主題地圖","variables":[],"preview":"比較同一地區的兩種公開地圖，例如交通圖與地形圖，分析各自呈現與省略的資訊。","evidence":"兩種地圖的來源、資訊取捨比較","directions":["比較同一地點的交通圖與地形圖，找出各自適合回答的問題。","不同地圖省略了哪些資訊？","地圖用途如何影響呈現方式？"]},{"id":"5-9","category":"世界探險家","title":"十年後少了什麼","mission":"以前常見的物品可能因新技術而減少使用，但有些舊物仍因價格、習慣或特殊功能被保留下來。預測未來需要找出變化的證據，也要承認不確定性。 選一件現在常見的物品，查找技術發展線索，提出十年後可能被替代或保留的兩種情境。","hint":"選一項過去曾被預測會消失卻仍存在的物品，分析預測落空的原因。","output":"未來情境圖、比較簡報","variables":[],"preview":"選一件現在常見的物品，查找技術發展線索，提出十年後可能被替代或保留的兩種情境。","evidence":"物品變遷的資料、未來預測的理由與不確定處","directions":["選一項過去曾被預測會消失卻仍存在的物品，分析預測落空的原因。","哪些新技術可能取代舊物？","哪些需求會讓舊物繼續存在？"]},{"id":"0-10","category":"創意發明所","title":"聲音故事盒","mission":"電影裡的腳步聲、風聲甚至怪獸叫聲，有時竟然來自平凡的生活用品！聲音能讓聽眾想像看不見的畫面。試著不靠文字說明，讓聽眾從聲音猜出角色正在經歷什麼。 用家中安全物品錄製五種音效，編一段不靠旁白也能理解的故事，請家人猜情節後修改。","hint":"試著只改變音效的音量或節奏，觀察聽眾對故事氣氛的理解。","output":"音檔、分鏡","symbol":"🎧","variables":[],"preview":"用家中安全物品錄製五種音效，編一段不靠旁白也能理解的故事，請家人猜情節後修改。","evidence":"自己錄製的音效、聽眾猜測結果與修正","directions":["試著只改變音效的音量或節奏，觀察聽眾對故事氣氛的理解。","哪些聲音可以交代場景？","聽眾猜錯時要調整哪段音效？"]},{"id":"0-11","category":"創意發明所","title":"百元桌遊設計師","mission":"桌遊的魅力不只在棋子和卡片，而在玩家每次選擇可能帶來不同結果。假如你的材料預算很有限，能不能設計出讓大家想再玩一次的遊戲？還要考慮等待時間和規則是否容易理解。 以紙卡和現有小物設計十分鐘桌遊，設定勝利條件，試玩兩次並修正規則。","hint":"比較領先與落後玩家的選擇，設計讓雙方都願意繼續玩的機制。","output":"桌遊、試玩紀錄","symbol":"🎲","variables":[],"preview":"以紙卡和現有小物設計十分鐘桌遊，設定勝利條件，試玩兩次並修正規則。","evidence":"第一版規則、試玩遇到的問題與修改","directions":["比較領先與落後玩家的選擇，設計讓雙方都願意繼續玩的機制。","玩家有哪些真正的選擇？","如何避免有人長時間等待？"]},{"id":"0-12","category":"創意發明所","title":"看不懂文字也能懂","mission":"搭車、洗手或組裝物品時，我們常會遇到不用文字的圖示。當讀者年紀不同或不懂同一種語言時，圖像就格外重要。你能不能讓一個完全沒看過操作的人，只靠你的圖完成任務？ 選一項日常操作，設計六格無字說明圖，讓家人照圖操作安全物品。","hint":"讓試用者指出看不懂的圖，而不是先解釋圖意，再依回饋修改。","output":"圖解、測試紀錄","symbol":"🖼️","variables":[],"preview":"選一項日常操作，設計六格無字說明圖，讓家人照圖操作安全物品。","evidence":"無字圖初稿、試用者看錯的步驟與修正版","directions":["讓試用者指出看不懂的圖，而不是先解釋圖意，再依回饋修改。","哪些動作需要方向箭頭？","如何讓圖示不依賴文字背景？"]},{"id":"0-13","category":"創意發明所","title":"包裝第二人生","mission":"買完東西後留下的紙盒、紙袋常被直接丟掉，但它們原本的形狀也許正適合另一項用途。重新利用不是只把東西裝飾得漂亮，而是讓它真的能解決生活中的問題。 選乾淨的廢包裝，設計兩種新用途，實作其中一種並測試耐用性。","hint":"估算新增材料的用量，評估改造是否真的減少資源消耗。","output":"實物、草圖","symbol":"📦","variables":[],"preview":"選乾淨的廢包裝，設計兩種新用途，實作其中一種並測試耐用性。","evidence":"原包裝與改造作品、耐用測試結果","directions":["估算新增材料的用量，評估改造是否真的減少資源消耗。","原包裝的形狀有哪些優勢？","改造後能使用多久？"]},{"id":"0-14","category":"創意發明所","title":"迷你城市公園","mission":"公園裡有人想運動，有人想安靜休息，也有人需要平坦的路面才能移動。如果空間有限，你會如何安排這些需求？試著當一回都市設計師，思考設施之間是否會互相干擾。 在一張A4紙上規劃公園，兼顧兒童、長輩及輪椅使用者，製作比例模型。","hint":"安排尖峰時段的使用情境，看看入口或設施是否容易擁擠。","output":"模型、配置圖","symbol":"🌳","variables":[],"preview":"在一張A4紙上規劃公園，兼顧兒童、長輩及輪椅使用者，製作比例模型。","evidence":"公園配置初稿、不同使用者的動線檢查","directions":["安排尖峰時段的使用情境，看看入口或設施是否容易擁擠。","球場和休息區會互相干擾嗎？","輪椅使用者能到達哪些設施？"]},{"id":"0-15","category":"創意發明所","title":"會變形的家具","mission":"小房間裡如果同一件家具可以變成兩種用途，就能節省不少空間。不過變形時是否容易夾手、會不會倒下、收起來是否方便，都是設計師需要考慮的問題。 設計一件能切換兩種用途的迷你家具，用紙板製作可動模型。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較展開與收起所需的空間，評估轉換是否值得。","output":"模型、操作影片","symbol":"🪑","variables":[],"preview":"設計一件能切換兩種用途的迷你家具，用紙板製作可動模型。","evidence":"家具兩種狀態的模型、轉換時遇到的問題","directions":["比較展開與收起所需的空間，評估轉換是否值得。","哪種轉換構造最容易操作？","家具如何避免傾倒？"]},{"id":"0-16","category":"創意發明所","title":"怪獸圖鑑","mission":"想像一顆星球白天炎熱、夜晚寒冷，住在那裡的生物會長什麼樣子？真實動物的耳朵、皮毛、腳掌都有各自的功能。你的怪獸除了外形有趣，還得能在自己設定的環境中生活。 從三種真實動物選取特徵，創造適應某種環境的生物，畫出生活場景。","hint":"替怪獸設計食物來源與天敵，檢查牠的能力是否符合生存需求。","output":"圖鑑、棲地圖","symbol":"🐾","variables":[],"preview":"從三種真實動物選取特徵，創造適應某種環境的生物，畫出生活場景。","evidence":"真實動物特徵來源、怪獸適應環境的設計理由","directions":["替怪獸設計食物來源與天敵，檢查牠的能力是否符合生存需求。","環境有哪些生存挑戰？","不同動物特徵組合後會有什麼限制？"]},{"id":"0-17","category":"創意發明所","title":"口袋博物館","mission":"博物館不一定要收藏昂貴的古董，普通物品也能說出一段故事。假如你只有一張桌子的展覽空間，如何讓觀眾從五件物品看見你想傳達的主題，而不是只看見一堆東西？ 挑選五件普通小物，依共同主題策展，設計展品順序與說明，邀人參觀。","hint":"設計兩種參觀順序，觀察觀眾對展覽主題的理解是否不同。","output":"微型展覽","symbol":"🏛️","variables":[],"preview":"挑選五件普通小物，依共同主題策展，設計展品順序與說明，邀人參觀。","evidence":"展品排列初稿、觀眾回饋與調整","directions":["設計兩種參觀順序，觀察觀眾對展覽主題的理解是否不同。","五件物品如何串成故事？","觀眾參觀後會記住什麼？"]},{"id":"0-18","category":"創意發明所","title":"一分鐘定格動畫","mission":"動畫裡看似連續的動作，其實可以由許多張靜止照片組成。當角色每次只移動一點點，觀眾就可能感覺它活了起來。試著用手邊的玩具拍一段有起因和結果的小故事。 用玩具或紙偶拍攝短片，先畫分鏡，再調整動作與鏡頭。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較相同動作使用不同照片張數時，影片速度與流暢度的差異。","output":"動畫、分鏡","symbol":"🎬","variables":[],"preview":"用玩具或紙偶拍攝短片，先畫分鏡，再調整動作與鏡頭。","evidence":"分鏡草圖、自己拍攝的畫面與修改片段","directions":["比較相同動作使用不同照片張數時，影片速度與流暢度的差異。","每次移動多少距離才自然？","鏡頭角度如何交代情節？"]},{"id":"0-19","category":"創意發明所","title":"不用手扶的書架","mission":"看食譜、抄筆記或閱讀時，一隻手一直扶著書本可能很不方便。市面上的閱讀架有不同角度和支撐方式，自己設計時也要考慮書本厚度、翻頁和桌面空間。 用紙板設計能支撐不同厚度書本的閱讀架，測試兩種角度。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"測試書架在光滑與粗糙桌面上的表現，找出防滑方法。","output":"模型、測試照片","symbol":"📚","variables":[],"preview":"用紙板設計能支撐不同厚度書本的閱讀架，測試兩種角度。","evidence":"書架原型、不同書本及角度的測試結果","directions":["測試書架在光滑與粗糙桌面上的表現，找出防滑方法。","厚書和薄書需要不同支撐嗎？","翻頁時如何保持穩定？"]},{"id":"1-10","category":"科學實驗室","title":"水往哪裡爬","mission":"擦桌子的紙巾會吸水，植物也能透過細小構造運送水分。當紙條的一端碰到水，水竟然可能往上移動！不同紙材的纖維結構會影響這個現象，值得仔細比較。 將不同紙材的一端浸入等深清水，每分鐘量水上升高度，比較吸水情形。","hint":"比較吸水速度與最後吸水量，看看兩種指標的排名是否相同。","output":"照片、折線圖","symbol":"💧","variables":["紙材","紙條寬度、浸水深度、時間","上升高度（公分）"],"preview":"將不同紙材的一端浸入等深清水，每分鐘量水上升高度，比較吸水情形。","evidence":"紙材樣本、各時間的水位高度","directions":["比較吸水速度與最後吸水量，看看兩種指標的排名是否相同。","紙纖維方向可能影響吸水嗎？","如何記錄水位隨時間變化？"]},{"id":"1-11","category":"科學實驗室","title":"糖消失的速度","mission":"泡飲料時，砂糖有時很快就看不見，有時卻沉在杯底。溶解速度會受到多種條件影響，食品製作也需要掌握這些變化。你能設計公平的比較，找出水溫的影響嗎？ 在相同水量中加入等量砂糖，比較不同水溫下溶解時間，僅用冷水與溫水。","hint":"觀察溶液底部是否仍有糖粒，訂出一致的溶解完成判準。","output":"實驗影片、紀錄表","symbol":"🥄","variables":["水溫","糖量、水量、攪拌方式","溶解時間（秒）"],"preview":"在相同水量中加入等量砂糖，比較不同水溫下溶解時間，僅用冷水與溫水。","evidence":"水溫實測值、溶解時間及重複測試","directions":["觀察溶液底部是否仍有糖粒，訂出一致的溶解完成判準。","如何控制攪拌次數？","水溫在測試過程中會不會改變？"]},{"id":"1-12","category":"科學實驗室","title":"降落傘救援","mission":"降落傘能幫助物品減慢下降速度，空投物資也可能利用類似原理。傘面大小、形狀與載重都會影響下降情形。先從輕巧的紙團開始，不需要從高處或窗外進行測試。 用紙或薄布做小降落傘，搭配相同輕量紙團，在室內安全高度測試。","hint":"記錄降落時左右晃動的幅度，評估除了速度以外的安全性。","output":"模型、慢動作影片","symbol":"🪂","variables":["傘面大小","載重、繩長、落下高度","下降時間（秒）"],"preview":"用紙或薄布做小降落傘，搭配相同輕量紙團，在室內安全高度測試。","evidence":"傘面尺寸、下降時間與試飛影片或草圖","directions":["記錄降落時左右晃動的幅度，評估除了速度以外的安全性。","傘面大小如何影響穩定性？","如何讓每次釋放方式一致？"]},{"id":"1-13","category":"科學實驗室","title":"摩擦力跑道","mission":"玩具車在磁磚、地毯和桌面上滑行的距離可能不同。生活中的鞋底、輪胎和煞車也都與摩擦力有關。這次用固定斜坡當作出發裝置，減少每次推車力道不同的影響。 用斜板讓同一玩具車滑行，比較不同表面上的停止距離。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較車輪是否打滑或卡住，判斷停止距離是否只受到摩擦影響。","output":"跑道、數據圖","symbol":"🚗","variables":["表面材質","斜坡、車子、起點","滑行距離（公分）"],"preview":"用斜板讓同一玩具車滑行，比較不同表面上的停止距離。","evidence":"跑道材質、各次滑行距離","directions":["比較車輪是否打滑或卡住，判斷停止距離是否只受到摩擦影響。","跑道材質有哪些可觀察的差異？","車子停止距離如何測量？"]},{"id":"1-14","category":"科學實驗室","title":"浮力小船","mission":"一小片金屬可能沉入水中，巨大的金屬船卻能浮在海上。船形會影響排開水的體積與穩定性。利用鋁箔做迷你貨船，看看怎樣的設計比較能載貨而不進水。 用等量鋁箔製作不同船形，在水盆中逐一放入相同小物，記錄沉沒前載重。","hint":"比較相同載重下不同船形的吃水深度，觀察剩餘的安全高度。","output":"船模型、承重表","symbol":"⛵","variables":["船形","鋁箔量、水盆、載重方式","最大載重（克）"],"preview":"用等量鋁箔製作不同船形，在水盆中逐一放入相同小物，記錄沉沒前載重。","evidence":"船形草圖、載重數據及沉沒前的情形","directions":["比較相同載重下不同船形的吃水深度，觀察剩餘的安全高度。","貨物放在船中央或邊緣有何差異？","如何判定船已達承重上限？"]},{"id":"1-15","category":"科學實驗室","title":"蒸發去哪了","mission":"曬衣服、晾乾地板或放著一杯水，都可能看見蒸發造成的變化。水不見得需要沸騰才會變成水蒸氣。容器開口大小也是生活中影響水分散失的條件之一。 將等量清水放在不同開口大小的容器中，固定位置觀察一天的重量變化。","hint":"記錄每天的室內溫度與通風狀況，解釋蒸發速度的變化。","output":"照片、重量圖","symbol":"☀️","variables":["開口面積","水量、環境、時間","重量減少（克）"],"preview":"將等量清水放在不同開口大小的容器中，固定位置觀察一天的重量變化。","evidence":"容器開口尺寸、前後重量紀錄","directions":["記錄每天的室內溫度與通風狀況，解釋蒸發速度的變化。","容器形狀如何影響水面面積？","怎樣排除水被碰倒的可能？"]},{"id":"1-16","category":"科學實驗室","title":"磁鐵隔著什麼","mission":"磁鐵隔著冰箱門上的紙張仍可能吸住物品，但距離增加後效果可能改變。磁力不需要直接接觸才能作用，這項特性也被運用在各種裝置。用紙片厚度做一場小型測試。 用同一磁鐵隔著不同厚度的紙片吸引迴紋針，比較可吸起的數量。","hint":"比較相同厚度的不同非磁性材料，看看距離是否比材質更重要。","output":"測試表、示意圖","symbol":"🧲","variables":["紙片厚度","磁鐵、迴紋針、操作方式","吸起數量"],"preview":"用同一磁鐵隔著不同厚度的紙片吸引迴紋針，比較可吸起的數量。","evidence":"紙片厚度、各次吸起的迴紋針數","directions":["比較相同厚度的不同非磁性材料，看看距離是否比材質更重要。","紙片厚度與磁鐵距離有何關係？","如何保持迴紋針排列一致？"]},{"id":"1-17","category":"科學實驗室","title":"橡皮筋的音高","mission":"吉他、古箏和小提琴都利用振動產生聲音。即使沒有樂器，紙盒和橡皮筋也能幫助我們探索音高。注意聽聲音的高低，不要只用聲音大不大來判斷。 將同一橡皮筋固定於紙盒，調整振動長度，輕撥並比較音高，避免拉得過緊。","hint":"用錄音或調音工具比較頻率，避免把音量大小當成音高。","output":"錄音、裝置圖","symbol":"🎵","variables":["振動長度","橡皮筋、張力、撥動方式","音高（相對或赫茲）"],"preview":"將同一橡皮筋固定於紙盒，調整振動長度，輕撥並比較音高，避免拉得過緊。","evidence":"振動長度、音高比較錄音或觀察紀錄","directions":["用錄音或調音工具比較頻率，避免把音量大小當成音高。","振動長度如何影響音高？","如何避免張力改變干擾結果？"]},{"id":"1-18","category":"科學實驗室","title":"種子醒來了","mission":"一顆乾燥種子看起來沒有動靜，遇到合適條件卻可能開始發芽。農夫播種時需要考慮水分、溫度等條件，水越多也不一定越好。讓我們透過一週觀察找出線索。 用相同種子比較不同適量供水條件下的發芽情形，觀察七天，不食用實驗種子。","hint":"比較同組種子的發芽時間差異，看看平均值是否掩蓋個別變化。","output":"觀察日誌、照片","symbol":"🌱","variables":["供水量","種子種類、數量、溫度","發芽數"],"preview":"用相同種子比較不同適量供水條件下的發芽情形，觀察七天，不食用實驗種子。","evidence":"每日發芽數、供水量與生長照片或草圖","directions":["比較同組種子的發芽時間差異，看看平均值是否掩蓋個別變化。","水量如何固定並記錄？","發芽與後續生長應如何分開比較？"]},{"id":"1-19","category":"科學實驗室","title":"旋轉紙蜻蜓","mission":"有些植物種子落下時會旋轉，讓它們在空中停留較久。紙蜻蜓也能呈現類似現象，設計不同翼長時，旋轉與下降情形可能跟著改變。用簡單材料就能研究空氣阻力。 製作不同翼長的紙蜻蜓，從固定安全高度放下，各測三次。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"記錄旋轉圈數與下降時間，檢查兩者是否有一致的關係。","output":"模型、影片","symbol":"🍃","variables":["翼長","紙材、重量、落下高度","下降時間（秒）"],"preview":"製作不同翼長的紙蜻蜓，從固定安全高度放下，各測三次。","evidence":"翼長尺寸、各次下降時間及旋轉觀察","directions":["記錄旋轉圈數與下降時間，檢查兩者是否有一致的關係。","翼長如何影響旋轉姿態？","每次落下時如何保持起始條件？"]},{"id":"2-10","category":"生活調查局","title":"早餐花多少錢","mission":"早餐店裡同樣的預算可能買到不同份量的餐點。除了價格，食材種類、飽足感與個人需求也值得考慮。這次試著規劃一份有理由的早餐選擇，而不是單純找最便宜的。 查三種早餐組合的公開價格與份量，在固定預算下比較飽足與營養需求。","hint":"比較不同店家的同類餐點，檢查價格差異是否伴隨份量差異。","output":"比較表、菜單","symbol":"🍳","variables":[],"preview":"查三種早餐組合的公開價格與份量，在固定預算下比較飽足與營養需求。","evidence":"公開價格與份量來源、自己的預算計算","directions":["比較不同店家的同類餐點，檢查價格差異是否伴隨份量差異。","相同預算有哪些不同搭配？","份量和營養如何一起考慮？"]},{"id":"2-11","category":"生活調查局","title":"家中用水地圖","mission":"打開水龍頭就有水，讓我們很容易忽略一天到底用了多少。洗手、洗澡和清潔的用水方式不同，估算時也需要不同方法。從家中安全的日常活動開始追蹤。 在家人同意下記錄一天用水活動，以容器容量或時間估算用量。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"把用水量乘上每天的使用次數，找出最值得優先改善的習慣。","output":"用水圖、改善提案","symbol":"🚰","variables":[],"preview":"在家人同意下記錄一天用水活動，以容器容量或時間估算用量。","evidence":"用水活動紀錄、實測或估算方法","directions":["把用水量乘上每天的使用次數，找出最值得優先改善的習慣。","哪些活動最耗水？","估算值可能有哪些誤差？"]},{"id":"2-12","category":"生活調查局","title":"招牌文字觀察","mission":"走在街上，招牌可能在幾秒內就讓你知道店家賣什麼，也可能讓人看了半天還是不明白。文字大小、色彩對比和排列方式都是視覺設計的一部分。 在家人陪同下觀察十個商店招牌，記錄字體、色彩與資訊安排，不拍人。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較相同字體在不同背景上的辨識效果，找出最清楚的搭配。","output":"招牌圖鑑","symbol":"🪧","variables":[],"preview":"在家人陪同下觀察十個商店招牌，記錄字體、色彩與資訊安排，不拍人。","evidence":"親自觀察的招牌草圖、設計比較","directions":["比較相同字體在不同背景上的辨識效果，找出最清楚的搭配。","字體大小與色彩如何影響辨識？","不同距離的閱讀效果如何？"]},{"id":"2-13","category":"生活調查局","title":"我的時間去哪了","mission":"放學後明明有好幾個小時，怎麼一下子就到了睡覺時間？時間紀錄能幫助我們看見平常忽略的活動，也能分辨哪些事情真的花了很久、哪些只是感覺很久。 連續三天記錄自己的活動時間，畫出時間分布並試改一項安排。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"區分必要活動與可自行安排的活動，找出真正能調整的時間。","output":"時間圖、試行紀錄","symbol":"⏳","variables":[],"preview":"連續三天記錄自己的活動時間，畫出時間分布並試改一項安排。","evidence":"三天時間紀錄、調整前後的差異","directions":["區分必要活動與可自行安排的活動，找出真正能調整的時間。","哪些活動比預期更耗時？","調整後是否影響休息？"]},{"id":"2-14","category":"生活調查局","title":"無障礙路線","mission":"對走路方便的人來說，一個小門檻可能毫不起眼；對使用輪椅或推車的人來說，卻可能是重要障礙。觀察真實環境能讓我們發現設計是否照顧不同使用者。 在安全校園路線觀察坡道、門檻與通道寬度，不模擬危險行動。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"觀察路線轉彎處與門口的空間，檢查推車是否有足夠迴轉位置。","output":"路線圖、改善草圖","symbol":"♿","variables":[],"preview":"在安全校園路線觀察坡道、門檻與通道寬度，不模擬危險行動。","evidence":"實際路線草圖、障礙位置及改善理由","directions":["觀察路線轉彎處與門口的空間，檢查推車是否有足夠迴轉位置。","門檻與坡道如何影響通行？","改善設計會不會妨礙其他人？"]},{"id":"2-15","category":"生活調查局","title":"圖書館尋書挑戰","mission":"圖書館收藏大量書籍，如果沒有分類和標示，找書可能像尋寶一樣困難。圖書館員設計的資訊系統能協助讀者定位，也值得我們從第一次使用者的角度檢視。 挑三本不同類型的書，記錄如何利用分類、索書號與標示找到它們。","hint":"記錄從查詢到找到書的時間，找出最耗時的步驟。","output":"尋書指南","symbol":"📖","variables":[],"preview":"挑三本不同類型的書，記錄如何利用分類、索書號與標示找到它們。","evidence":"三本書的尋找過程、遇到的標示問題","directions":["記錄從查詢到找到書的時間，找出最耗時的步驟。","索書號如何協助定位？","初次使用者在哪一步容易迷路？"]},{"id":"2-16","category":"生活調查局","title":"食品包裝偵探","mission":"食品包裝常用漂亮圖片和醒目文字吸引顧客，但正面宣傳不一定呈現全部資訊。成分、份量和營養標示可以幫助我們做更有根據的選擇。 比較三款同類食品的正面宣傳與背面標示，找出容易忽略的資訊。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較同類商品的成分排序，找出宣傳沒有提到的差異。","output":"包裝分析圖","symbol":"🏷️","variables":[],"preview":"比較三款同類食品的正面宣傳與背面標示，找出容易忽略的資訊。","evidence":"實際包裝標示、宣傳文字與資訊比較","directions":["比較同類商品的成分排序，找出宣傳沒有提到的差異。","正面宣傳與背面標示是否一致？","不同容量如何公平比較？"]},{"id":"2-17","category":"生活調查局","title":"家庭老物件訪談","mission":"家裡的舊收音機、老照片或早期生活用品，可能記錄了不同年代的生活方式。透過物件和家人的回憶，我們能理解科技與習慣如何改變，但也要尊重不願分享的內容。 經家人同意選一件老物品，訪問用途及使用變化，不記錄私人身分資訊。","hint":"把訪談中的年代線索排成時間軸，找出仍需查證的部分。","output":"物件故事卡","symbol":"📻","variables":[],"preview":"經家人同意選一件老物品，訪問用途及使用變化，不記錄私人身分資訊。","evidence":"經同意的物件草圖或照片、匿名訪談重點","directions":["把訪談中的年代線索排成時間軸，找出仍需查證的部分。","物件的使用方式如何改變？","回憶有哪些地方能用實物佐證？"]},{"id":"2-18","category":"生活調查局","title":"校園聲音地圖","mission":"校園裡除了說話聲，還有鳥叫、風聲、鐘聲和設備運轉聲。不同地點的聲音組合會影響我們的感受，也能反映空間用途。試著用圖像記錄你聽見的環境。 在三個安全位置記錄不同時段的聲音種類與相對音量，不錄他人談話。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"區分持續聲與突然出現的聲音，觀察哪一種更容易干擾活動。","output":"聲音地圖","symbol":"🔊","variables":[],"preview":"在三個安全位置記錄不同時段的聲音種類與相對音量，不錄他人談話。","evidence":"各地點與時段的聲音紀錄、聲音地圖","directions":["區分持續聲與突然出現的聲音，觀察哪一種更容易干擾活動。","同一地點不同時段有何差異？","聲音種類與舒適感有何關係？"]},{"id":"2-19","category":"生活調查局","title":"修理還是換新","mission":"物品壞掉時，直接換新可能很方便，但修理也可能節省資源。價格只是其中一項考量，使用年限、安全和維修時間同樣重要。這次當一回理性的消費顧問。 選一件損壞的小物，查公開維修與替換價格，評估成本、時間與垃圾量，不自行拆電器。","hint":"估算每年使用成本，看看修理與換新的長期花費是否不同。","output":"決策圖、估價表","symbol":"🔧","variables":[],"preview":"選一件損壞的小物，查公開維修與替換價格，評估成本、時間與垃圾量，不自行拆電器。","evidence":"公開維修與換新價格來源、選擇理由","directions":["估算每年使用成本，看看修理與換新的長期花費是否不同。","維修後可能再使用多久？","換新造成的垃圾與成本如何比較？"]},{"id":"3-10","category":"心情練習所","title":"我的專注開關","mission":"寫作業時，桌上的玩具、通知聲或突然想到的事情都可能把注意力拉走。每個人適合的專注環境不完全一樣，與其照抄別人的方法，不如觀察自己真正受到哪些干擾。 選一項短作業，比較桌面整理前後的專注情形，記錄三次並調整環境。","hint":"記錄分心後回到任務所需的時間，找出最難處理的干擾。","output":"觀察日誌","symbol":"🎯","variables":[],"preview":"選一項短作業，比較桌面整理前後的專注情形，記錄三次並調整環境。","evidence":"桌面調整前後的三次專注紀錄","directions":["記錄分心後回到任務所需的時間，找出最難處理的干擾。","哪些干擾來自環境？","如何判斷調整真的有幫助？"]},{"id":"3-11","category":"心情練習所","title":"稱讚要有證據","mission":"一句你好棒可能讓人開心，但如果能指出對方如何努力、合作或解決問題，對方更容易知道自己的行動受到肯定。這也是團隊建立信任的一種方式。 觀察三個日常合作行為，練習說出具體欣賞的地方，不記錄他人姓名。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"觀察對方收到具體稱讚後的反應，思考哪些細節讓稱讚更可信。","output":"欣賞卡","symbol":"🌟","variables":[],"preview":"觀察三個日常合作行為，練習說出具體欣賞的地方，不記錄他人姓名。","evidence":"三個具體合作行為的匿名觀察、稱讚方式","directions":["觀察對方收到具體稱讚後的反應，思考哪些細節讓稱讚更可信。","稱讚行動與稱讚天分有何不同？","怎樣讓稱讚具體而真誠？"]},{"id":"3-12","category":"心情練習所","title":"求助練習室","mission":"遇到不會的事，有人會悶著頭一直試，有人則馬上請別人代做。有效求助其實需要先說清楚自己試過什麼、卡在哪裡，才能得到真正有幫助的資訊。 選一件自己不熟悉的小任務，設計三種求助說法，和家人演練。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較請人提示第一步與請人直接給答案，看看自己還能練習哪些能力。","output":"角色短劇","symbol":"🤝","variables":[],"preview":"選一件自己不熟悉的小任務，設計三種求助說法，和家人演練。","evidence":"自己試過的步驟、求助演練與修正","directions":["比較請人提示第一步與請人直接給答案，看看自己還能練習哪些能力。","自己已經試過哪些方法？","如何說清楚卡住的地方？"]},{"id":"3-13","category":"心情練習所","title":"計畫突然改變","mission":"期待很久的活動突然取消，原本安排好的事情也可能全部打亂。失望不必立刻消失，但我們可以思考接下來有哪些選擇，讓一天不完全被意外決定。 虛構一次期待落空的活動，設計備案與安頓情緒的方式，演練兩種反應。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"列出意外發生後仍可掌握的資源與時間，設計一個可立即執行的備案。","output":"分支漫畫","symbol":"🗓️","variables":[],"preview":"虛構一次期待落空的活動，設計備案與安頓情緒的方式，演練兩種反應。","evidence":"原計畫與備案、兩種反應的演練結果","directions":["列出意外發生後仍可掌握的資源與時間，設計一個可立即執行的備案。","哪些安排仍可保留？","備案如何照顧自己的期待？"]},{"id":"3-14","category":"心情練習所","title":"我也會看錯人","mission":"第一眼看到某個人安靜、不愛說話或動作很慢，我們可能很快替他貼上標籤。但後來的資訊也許會讓原本的判斷改變。練習保留疑問，是理解別人的重要能力。 從虛構人物的第一印象出發，逐步加入新線索，記錄自己如何修正看法。","hint":"替同一個行為提出兩種合理解釋，找出需要哪些新線索才能判斷。","output":"人物卡、修正圖","symbol":"🔍","variables":[],"preview":"從虛構人物的第一印象出發，逐步加入新線索，記錄自己如何修正看法。","evidence":"人物線索卡、加入新資訊前後的判斷","directions":["替同一個行為提出兩種合理解釋，找出需要哪些新線索才能判斷。","第一印象依據哪些線索？","新資訊如何改變判斷？"]},{"id":"3-15","category":"心情練習所","title":"慢一點再回話","mission":"被誤會或被挑釁時，第一句脫口而出的話可能讓事情更難處理。短暫停頓不是認輸，而是讓自己有機會決定要確認、拒絕還是離開。 設計三個容易衝動回應的情境，練習停頓、確認意思與表達界線。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較立即回話與停頓後回話的內容，找出哪些措辭容易引發爭執。","output":"情境卡、演練","symbol":"💬","variables":[],"preview":"設計三個容易衝動回應的情境，練習停頓、確認意思與表達界線。","evidence":"三個情境的停頓與回應演練","directions":["比較立即回話與停頓後回話的內容，找出哪些措辭容易引發爭執。","衝動時有哪些身體訊號？","停頓後如何選擇回應？"]},{"id":"3-16","category":"心情練習所","title":"合作中的隱形工作","mission":"團隊成果常由上台報告的人代表，但事前準備、整理材料、提醒時間的人也可能付出很多。觀察這些不容易被看見的工作，有助於更公平地理解合作。 觀察或虛構一次團隊活動，列出準備、整理、協調等容易被忽略的工作。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"試著估算每項分工所需的時間與難度，看看工作量是否真的平均。","output":"工作分布圖","symbol":"🧩","variables":[],"preview":"觀察或虛構一次團隊活動，列出準備、整理、協調等容易被忽略的工作。","evidence":"團隊工作分布圖、容易被忽略的貢獻","directions":["試著估算每項分工所需的時間與難度，看看工作量是否真的平均。","哪些工作不容易被看見？","如何讓分工更公平？"]},{"id":"3-17","category":"心情練習所","title":"我的休息實驗","mission":"做事情累了需要休息，但滑手機、伸展、喝水或安靜坐一會兒，帶來的感受可能不同。適合自己的休息方式應該能幫助回到原本的任務，而不是讓自己更疲倦。 在正常作息下比較兩種短休息方式，記錄回到任務後的感受，不減少睡眠。","hint":"記錄休息前後完成同類任務的速度與感受，找出適合自己的休息長度。","output":"試行紀錄","symbol":"🌿","variables":[],"preview":"在正常作息下比較兩種短休息方式，記錄回到任務後的感受，不減少睡眠。","evidence":"兩種休息方式的試行紀錄與感受","directions":["記錄休息前後完成同類任務的速度與感受，找出適合自己的休息長度。","不同休息方式帶來什麼感受？","回到任務時如何比較效果？"]},{"id":"3-18","category":"心情練習所","title":"站在另一雙鞋裡","mission":"行動不便可能來自疾病、意外或不同的身體條件，並不是當事人自己選擇的。理解需求不等於替別人決定一切，真正尊重的協助需要聽見當事人的意見。 選一個虛構的行動不便者日常情境，查閱當事人公開分享，提出尊重需求的協助方式。","hint":"比較主動代勞與提供選擇的協助方式，思考哪種更能保留對方自主權。","output":"情境圖、倡議卡","symbol":"👟","variables":[],"preview":"選一個虛構的行動不便者日常情境，查閱當事人公開分享，提出尊重需求的協助方式。","evidence":"當事人公開分享的來源、協助方式的修正","directions":["比較主動代勞與提供選擇的協助方式，思考哪種更能保留對方自主權。","環境障礙與個人能力有何不同？","如何先詢問對方的需求？"]},{"id":"3-19","category":"心情練習所","title":"給未來自己的提醒","mission":"想養成習慣時，光靠一句我要更認真可能不夠。把提醒放在需要行動的地方、降低開始的難度，都可能讓計畫更容易執行。這次替未來的自己設計一個小幫手。 選一個想改善的小習慣，設計環境提示，試行五天並記錄失敗時如何調整。","hint":"觀察提醒使用幾天後是否逐漸被忽略，設計讓提醒保持有效的方法。","output":"提示物、日誌","symbol":"📌","variables":[],"preview":"選一個想改善的小習慣，設計環境提示，試行五天並記錄失敗時如何調整。","evidence":"自己設計的提醒物、五天使用紀錄與調整","directions":["觀察提醒使用幾天後是否逐漸被忽略，設計讓提醒保持有效的方法。","提醒物應放在哪個位置？","忘記執行時如何調整設計？"]},{"id":"4-10","category":"思辨選擇題","title":"校園應該禁止手機嗎","mission":"手機可以用來聯絡家人、查資料，也可能在課堂上造成干擾。全面禁止、限定時間使用或由教師管理，各有不同成本與好處。試著從不同使用者的角度思考。 假設學校討論手機管理，分別替學生、家長與教師提出理由，設計三種規則。","hint":"設計違反手機規則時的處理方式，評估是否會造成不必要的處罰。","output":"政策比較、辯論","symbol":"📱","variables":[],"preview":"假設學校討論手機管理，分別替學生、家長與教師提出理由，設計三種規則。","evidence":"三種手機規則、不同角色的理由與取捨","directions":["設計違反手機規則時的處理方式，評估是否會造成不必要的處罰。","不同使用時段有哪些需求？","如何處理緊急聯絡的例外？"]},{"id":"4-11","category":"思辨選擇題","title":"動物園有必要嗎","mission":"動物園可能提供教育與保育機會，但動物的活動空間、照護和生活需求也值得重視。不同動物園的條件並不相同，討論時需要具體資料，而不是只憑喜歡或討厭。 查兩個可信來源，區分保育、教育與動物福利，選一種動物討論適合的照護條件。","hint":"比較原地保育與人工照護的條件，思考哪些動物適合哪種方式。","output":"證據卡、觀點圖","symbol":"🐘","variables":[],"preview":"查兩個可信來源，區分保育、教育與動物福利，選一種動物討論適合的照護條件。","evidence":"兩個可信資料來源、保育與福利的證據比較","directions":["比較原地保育與人工照護的條件，思考哪些動物適合哪種方式。","保育成果如何查證？","不同動物的生活需求有何差異？"]},{"id":"4-12","category":"思辨選擇題","title":"免費的東西真的免費嗎","mission":"免費遊戲可能靠廣告或付費功能維持，公共圖書館也需要經費和人力。當我們不用直接付錢時，仍可能有人負擔成本，或需要付出時間與注意力。 比較免費遊戲、公共圖書館及試用品的成本來源，分析誰付出什麼。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較免費與付費版本的限制，找出使用者可能忽略的交換條件。","output":"成本關係圖","symbol":"🎁","variables":[],"preview":"比較免費遊戲、公共圖書館及試用品的成本來源，分析誰付出什麼。","evidence":"三種免費服務的成本來源、自己的判斷","directions":["比較免費與付費版本的限制，找出使用者可能忽略的交換條件。","免費服務由誰負擔成本？","注意力和個資是否也是代價？"]},{"id":"4-13","category":"思辨選擇題","title":"誰能決定公共空間","mission":"社區的空地只有一塊，想打球的人、想散步的人和需要安靜休息的人可能提出不同方案。公共空間的決策不能只看哪個提案最熱門，也要考慮使用限制。 假設空地只能設球場、花園或休憩區，分配有限預算並替不同使用者辯護。","hint":"設計不同時段輪流使用的方案，評估是否比永久分配更合理。","output":"公聽會短劇","symbol":"🏞️","variables":[],"preview":"假設空地只能設球場、花園或休憩區，分配有限預算並替不同使用者辯護。","evidence":"空間配置草圖、不同使用者的需求比較","directions":["設計不同時段輪流使用的方案，評估是否比永久分配更合理。","不同設施能否共用空間？","哪些使用者容易被忽略？"]},{"id":"4-14","category":"思辨選擇題","title":"照片能證明真相嗎","mission":"照片能記錄真實畫面，但拍攝角度、裁切範圍和搭配文字都會影響觀眾的理解。同一件事情可能因為只呈現部分資訊，而讓人產生完全不同的印象。 用自己的安全物品拍攝兩張不同角度的照片，設計可能造成誤解的說明，再補充完整資訊。","hint":"用同一張照片搭配兩種說明文字，分析哪些結論超出畫面能證明的範圍。","output":"照片對照、查證卡","symbol":"📷","variables":[],"preview":"用自己的安全物品拍攝兩張不同角度的照片，設計可能造成誤解的說明，再補充完整資訊。","evidence":"自己拍攝的兩張照片、完整情境與誤導說明對照","directions":["用同一張照片搭配兩種說明文字，分析哪些結論超出畫面能證明的範圍。","裁切畫面會遺漏哪些資訊？","如何查證照片搭配的說明？"]},{"id":"4-15","category":"思辨選擇題","title":"便利與環保怎麼選","mission":"外帶餐具帶來便利，也可能增加垃圾；重複使用的餐具則需要清洗和攜帶。比較環保方案時，需要考慮整個使用過程，而不是只看材料名稱。 比較外帶餐具的三種方案，查資料並考慮清洗、使用次數與衛生。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"估算重複使用多少次才可能減少資源消耗，說明估算所需的條件。","output":"利弊表、建議","symbol":"🍴","variables":[],"preview":"比較外帶餐具的三種方案，查資料並考慮清洗、使用次數與衛生。","evidence":"三種餐具方案的資料來源、使用條件與取捨","directions":["估算重複使用多少次才可能減少資源消耗，說明估算所需的條件。","重複使用需要哪些條件？","清洗與運輸會如何影響比較？"]},{"id":"4-16","category":"思辨選擇題","title":"比賽可以使用科技嗎","mission":"科技工具可以幫助參賽者呈現創意，但如果比賽原本要評量手工技巧或獨立思考，工具的使用方式就可能影響公平。不同競賽目標需要不同規則。 假設創作比賽允許不同工具，提出分類或限制方案，分析公平與創新。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較公開工具使用紀錄與限制工具種類兩種做法，分析執行難度。","output":"規則草案","symbol":"🏆","variables":[],"preview":"假設創作比賽允許不同工具，提出分類或限制方案，分析公平與創新。","evidence":"兩種競賽目標、工具規則與例外情況","directions":["比較公開工具使用紀錄與限制工具種類兩種做法，分析執行難度。","比賽真正要評量什麼能力？","如何讓工具使用規則透明？"]},{"id":"4-17","category":"思辨選擇題","title":"網路留言該刪除嗎","mission":"網路留言有時能指出問題，有時卻可能散布錯誤資訊或傷害他人。完全不管理與刪除所有不同意見都可能帶來問題，制定原則時需要區分留言的性質。 設計四種虛構留言，區分批評、錯誤資訊與人身攻擊，提出處理及申訴原則。","hint":"設計留言管理的分級處理方式，區分提醒、隱藏與刪除的適用情況。","output":"案例卡、流程圖","symbol":"💭","variables":[],"preview":"設計四種虛構留言，區分批評、錯誤資訊與人身攻擊，提出處理及申訴原則。","evidence":"四則虛構留言、分類理由與申訴方案","directions":["設計留言管理的分級處理方式，區分提醒、隱藏與刪除的適用情況。","批評與人身攻擊如何區分？","誤刪留言時如何補救？"]},{"id":"4-18","category":"思辨選擇題","title":"有限的救援資源","mission":"災害發生後，物資有時無法立刻滿足所有需求。不同家庭可能有不同人數、健康狀況與緊急程度。如何在有限資源下做出有理由又能調整的分配？ 假設暴雨後社區只有十份物資，依虛構家庭需求設計分配方案，分析例外。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較先到先得與依需求分配在物資不足時的結果，說明各自的風險。","output":"分配模擬","symbol":"📦","variables":[],"preview":"假設暴雨後社區只有十份物資，依虛構家庭需求設計分配方案，分析例外。","evidence":"虛構家庭需求表、分配結果及例外調整","directions":["比較先到先得與依需求分配在物資不足時的結果，說明各自的風險。","哪些需求最緊急？","新物資抵達後如何重新分配？"]},{"id":"4-19","category":"思辨選擇題","title":"保護隱私還是方便生活","mission":"校園門禁或便利服務可能利用各種身分辨識方式，但蒐集資料也會帶來保存與使用的責任。便利、安全和隱私之間需要仔細衡量，並考慮不使用某種技術的人。 比較虛構的校園門禁方案，分析辨識便利、資料保存與替代方式。","hint":"設計資料保存期限與刪除方式，思考服務結束後是否仍需要保留資料。","output":"風險表、提案","symbol":"🔐","variables":[],"preview":"比較虛構的校園門禁方案，分析辨識便利、資料保存與替代方式。","evidence":"門禁方案比較、必要資料與替代方式","directions":["設計資料保存期限與刪除方式，思考服務結束後是否仍需要保留資料。","哪些資料是必要的？","不願使用辨識技術的人有哪些替代方案？"]},{"id":"5-10","category":"世界探險家","title":"一滴自來水的旅行","mission":"打開水龍頭的那一刻，清水其實已經走過一段不短的旅程。水源、淨水設備、管線和污水處理各有不同功能，了解它們能幫助我們理解水資源的重要性。 查自來水事業公開資料，追蹤水源、淨水、輸送及使用後的去向，畫出流程。","hint":"比較水源不足與管線漏水造成的影響，找出不同環節的節水方法。","output":"流程圖、模型","symbol":"💧","variables":[],"preview":"查自來水事業公開資料，追蹤水源、淨水、輸送及使用後的去向，畫出流程。","evidence":"水務公開資料、自己繪製的水循環流程","directions":["比較水源不足與管線漏水造成的影響，找出不同環節的節水方法。","淨水與污水處理的目的有何不同？","水資源在哪些環節可能流失？"]},{"id":"5-11","category":"世界探險家","title":"世界的午餐盒","mission":"不同地方的學生午餐可能有不同食材、用餐時間與供餐制度。這些差異可能和氣候、農業、文化及學校政策有關，不一定代表哪個地方比較好。 選三個地區的公開校園午餐資料，比較食材、供餐方式與文化背景。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較同一國家不同地區或學校的午餐，避免把單一案例當成全國特色。","output":"午餐圖鑑","symbol":"🍱","variables":[],"preview":"選三個地區的公開校園午餐資料，比較食材、供餐方式與文化背景。","evidence":"三地午餐資料來源、相同與不同之處","directions":["比較同一國家不同地區或學校的午餐，避免把單一案例當成全國特色。","食材差異與氣候有何關係？","供餐制度如何影響午餐內容？"]},{"id":"5-12","category":"世界探險家","title":"文字的演化","mission":"在紙張普及之前，人們曾使用不同材料記錄訊息。書寫工具、材料和社會需求可能影響文字的形式。文字的演化也讓我們看見人類如何保存知識。 選一種文字系統，查博物館或教育資料，整理三個時期的書寫工具與字形。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較文字在不同媒介上的保存難度，思考哪些資訊容易流失。","output":"時間軸、仿寫卡","symbol":"✒️","variables":[],"preview":"選一種文字系統，查博物館或教育資料，整理三個時期的書寫工具與字形。","evidence":"三個時期的文字資料、書寫工具與字形比較","directions":["比較文字在不同媒介上的保存難度，思考哪些資訊容易流失。","書寫材料如何影響字形？","文字如何幫助知識傳承？"]},{"id":"5-13","category":"世界探險家","title":"海底電纜的秘密","mission":"跨國傳送訊息看似只需要按一下按鈕，但背後可能依靠海底光纖電纜傳輸。這些看不見的基礎設施連接不同地區，也需要維護與備援。 查公開海底電纜地圖及通訊資料，追蹤跨國訊息可能經過的路線。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較光纖與衛星傳輸的用途，找出各自適合的通訊情境。","output":"路線圖、解說模型","symbol":"🌐","variables":[],"preview":"查公開海底電纜地圖及通訊資料，追蹤跨國訊息可能經過的路線。","evidence":"公開電纜地圖來源、自己繪製的訊息路線","directions":["比較光纖與衛星傳輸的用途，找出各自適合的通訊情境。","海底電纜如何連接不同地區？","電纜中斷時有哪些備援方式？"]},{"id":"5-14","category":"世界探險家","title":"跟著候鳥旅行","mission":"有些鳥類每年跨越很長的距離，在不同季節前往不同棲地。牠們需要沿途休息和覓食，任何一處重要環境改變都可能影響整段旅程。 選一種候鳥，查保育機構資料，標出遷徙路線、停留地與季節。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"在遷徙地圖上標出可能的環境威脅，推測哪些停留點最需要保護。","output":"遷徙地圖","symbol":"🕊️","variables":[],"preview":"選一種候鳥，查保育機構資料，標出遷徙路線、停留地與季節。","evidence":"候鳥資料來源、遷徙地圖與棲地需求","directions":["在遷徙地圖上標出可能的環境威脅，推測哪些停留點最需要保護。","候鳥在哪些地點補充能量？","季節變化如何影響遷徙？"]},{"id":"5-15","category":"世界探險家","title":"古人如何保存食物","mission":"冰箱普及以前，人們必須利用乾燥、鹽漬或其他方式延長食物保存時間。不同地區的氣候和資源也可能形成不同飲食文化。 查三種傳統保存方法，比較不同氣候與資源下的選擇，不自行試吃保存實驗。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較保存方法對食物味道、重量與質地的影響，理解保存與飲食習慣的關係。","output":"歷史圖鑑","symbol":"🏺","variables":[],"preview":"查三種傳統保存方法，比較不同氣候與資源下的選擇，不自行試吃保存實驗。","evidence":"三種保存方法的資料來源、適用條件比較","directions":["比較保存方法對食物味道、重量與質地的影響，理解保存與飲食習慣的關係。","乾燥與鹽漬如何延長保存？","不同氣候適合哪些方法？"]},{"id":"5-16","category":"世界探險家","title":"一座城市的交通演變","mission":"城市從步行、馬車到電車、汽車和捷運的變化，不只是交通工具更新，也可能改變人們上班、上學和購物的距離。老地圖與照片可以提供研究線索。 選一座城市，利用公開老照片與現代交通圖，比較三個時期的移動方式。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較交通建設前後的商店與住宅分布，找出生活圈變化的線索。","output":"古今對照圖","symbol":"🚋","variables":[],"preview":"選一座城市，利用公開老照片與現代交通圖，比較三個時期的移動方式。","evidence":"三個時期的交通圖或照片來源、生活變化比較","directions":["比較交通建設前後的商店與住宅分布，找出生活圈變化的線索。","交通工具如何改變通勤距離？","哪些舊交通設施仍被使用？"]},{"id":"5-17","category":"世界探險家","title":"從沙子到玻璃","mission":"透明玻璃看起來和沙子完全不同，但某些玻璃的原料確實包含富含二氧化矽的砂。製造與回收都涉及能源、材料分類及加工技術。 查玻璃製造與回收的公開科普資料，整理原料、加工與再利用流程，不實際加熱。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較玻璃製品的用途與所需特性，思考為什麼不同玻璃不能一概混合回收。","output":"製程圖、展示卡","symbol":"🪟","variables":[],"preview":"查玻璃製造與回收的公開科普資料，整理原料、加工與再利用流程，不實際加熱。","evidence":"玻璃製造及回收資料來源、自己繪製的流程","directions":["比較玻璃製品的用途與所需特性，思考為什麼不同玻璃不能一概混合回收。","玻璃原料如何轉變成成品？","回收分類為什麼重要？"]},{"id":"5-18","category":"世界探險家","title":"世界如何報時間","mission":"當臺灣學生準備上學時，地球另一端的人可能正要睡覺。時區與地球自轉有關，也受到各地制度安排影響。跨國活動因此需要特別注意日期與時間。 比較三個時區的生活時間，查時區形成原因，設計跨國線上會議時刻表。 完成探索後，請整理你實際取得的發現，讓讀者了解這次任務的結果與生活應用。","hint":"比較地理位置相近但法定時間不同的地區，查找制度形成的原因。","output":"世界時鐘圖","symbol":"🕰️","variables":[],"preview":"比較三個時區的生活時間，查時區形成原因，設計跨國線上會議時刻表。","evidence":"三地時區資料、日期換算與會議安排","directions":["比較地理位置相近但法定時間不同的地區，查找制度形成的原因。","地球自轉與時區有何關係？","跨日會議如何避免日期錯誤？"]},{"id":"5-19","category":"世界探險家","title":"一件文物的身世","mission":"博物館裡一件小小的文物可能透露古人的生活習慣、技術和交易方式。研究者需要根據材料、出土地點和其他證據推測用途，有時也會留下尚未解答的問題。 選博物館公開典藏的一件文物，查年代、用途、材料與發現背景，設計自己的展牌。","hint":"比較同類文物的出土地點與形狀，找出支持用途推測的共同線索。","output":"展牌、微型導覽","symbol":"🏛️","variables":[],"preview":"選博物館公開典藏的一件文物，查年代、用途、材料與發現背景，設計自己的展牌。","evidence":"博物館典藏來源、展牌草稿及仍待確認的資訊","directions":["比較同類文物的出土地點與形狀，找出支持用途推測的共同線索。","文物的材料能透露什麼？","研究者如何區分證據與推測？"]}];const cats=['全部',...new Set(tasks.map(t= <br>希望小隊員藉由每週一回的挑戰，給自己一個腦力激盪碰撞火花的機會！<br>作品呈現的可以是五花八門的，除了基本的文字、圖像外<br>老師也很樂意接受大家把你的想法錄成影片、樂曲、實體作品跟大家分享<br>你的用心、努力不會辜負，都將滋養自己成長茁壯！</p><h3>靈光筆記給分原則</h3><dl><dt>退件</dt><dd>完全使用AI作答、抄襲他人/網路解答、敷衍了事</dd><dt>A-</dt><dd>僅完成部分任務、或回應缺乏個人思考、記事過於簡略。</dd><dt>A</dt><dd>大致回答主題，但多流水帳記事或回答不完整缺乏關鍵重點等。</dd><dt>A+</dt><dd>能以個人喜好形式展現成果，具體回應主題且富個人特色。</dd><dt>A++</dt><dd>主題新穎特別，在完整記錄思考過程、心得外還能有其他創意展現，如圖文並茂、搭配影片、動畫、程式等多元方式作答。</dd></dl><p class="tip">每人每學期都有3次免死金牌可以自行決定免寫靈光筆記的時機，<br>期末若有餘次可轉換為點數兌獎。</p></section><div class="grid" id="cards"></div>';document.querySelector('#search').oninput=x=>{query=x.target.value;cards()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;home()});cards()}function cards(){const list=tasks.filter(t=>(cat==='全部'||t.category===cat)&&(t.title+t.mission).includes(query));document.querySelector('#cards').innerHTML=list.map(t=>'<section class="card">'+art(t)+'<p class="tag">'+e(t.category)+'</p><h2>'+e(t.title)+'</h2><p>'+e(t.preview)+'</p><button data-id="'+t.id+'">閱讀探索任務</button></section>').join('')||'<p>沒有符合的題目。</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id})}function table(head,rows){return '<table><thead><tr>'+head.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x||'　')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}let pdfLibraries;

function detail(t){const sci=t.variables.length===3,think=t.category==='思辨選擇題';let extra=sci?'<details open><summary>實驗設計表（可抄寫或列印）</summary>'+table(['項目','規劃方向','我的紀錄'],[['研究目的',t.title,''],['假設','先預測並說明原因',''],['操縱變因',t.variables[0],''],['控制變因',t.variables[1],''],['應變變因',t.variables[2],''],['測試次數','規劃重複測量或多次觀察','']])+'<h3>數據紀錄表</h3>'+table(['條件／時間',t.variables[2],'重複測量或觀察備註'],[['','',''],['','',''],['','',''],['','',''],['','','']])+'<p>依實驗需要增減列數，標明單位；觀察型研究不必硬套實驗組。</p></details>':think?'<details><summary>觀點整理工具</summary>'+table(['方案／立場','好處','代價或風險','受影響的人','證據與疑問'],[['','','','',''],['','','','',''],['','','','','']])+'<p>先替不同立場找出合理理由，再想想有沒有反例或第三種方案。最後說明你最重視的原則，以及什麼證據可能讓你改變想法。</p></details>':'';let tip=sci?'保留原先預測、實際測量與改良紀錄。結果不如預期也沒關係，試著找出原因。':think?'除了說出自己的立場，也要公平看待反方，區分事實與推測，說明取捨及是否修正觀點。':t.category==='創意發明所'?'留下原始構想、實際試用與修改的痕跡，讓老師看得出你的設計是怎麼變好的。':t.category==='生活調查局'?'留下自己蒐集的資料與比較過程，不只整理網路上的答案。':t.category==='心情練習所'?'用具體情境呈現不同反應的後果，提出自己願意嘗試的做法，不必揭露私密經驗。':'比較不同資料的觀點，分清楚事實與推測，並用自己的方式解釋發現及其生活意義。';app.innerHTML='<article><div class="no-print"><button id="back">← 返回題庫</button> <button id="print">下載題目以列印</button></div><p class="tag">'+e(t.category)+'</p><h2>'+e(t.title)+'</h2>'+art(t)+'<h3>這次的挑戰</h3><p>'+e(t.mission)+'</p><details><summary>思考方向參考</summary><ul>'+t.directions.map(q=>'<li>'+e(q)+'</li>').join('')+'</ul><p>這些方向供你參考，不必逐題回答，也歡迎發展自己的探索方向。</p></details>'+extra+'<section class="evidence"><h3>我的探索證據與作品呈現</h3><p><b>探索過程：</b>'+e(t.evidence)+'。</p><p><b>呈現方式：</b>'+e(t.output)+'。也歡迎用其他適合的方式，呈現你實際做過的事。</p></section><p><b>基本要求｜資料來源：</b>凡引用書籍、網站、影片、圖片或其他人的資料，都必須標註來源（名稱、作者或機構，以及網址或書籍資訊）。</p><div class="tip"><b>高分秘訣</b><p>'+e(tip)+'</p></div></article>';document.querySelector('#back').onclick=()=>{location.hash=''};document.querySelector('#print').onclick=()=>downloadTask(t,document.querySelector('#print'));window.scrollTo(0,0)}function route(){const t=tasks.find(x=>x.id===location.hash.slice(1));t?detail(t):home()}window.addEventListener('hashchange',route);route();</s
