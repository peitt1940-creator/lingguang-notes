function show(){const t=task,r=get(t);root.innerHTML='<div class="paper"><button class="alt" id="home">返回題庫</button><p class="tag">'+t.category+'</p><h2>'+esc(t.title)+'</h2><p class="sub">'+esc(t.desc)+'</p><div class="bar"><div style="width:'+((step+1)/t.steps.length*100)+'%"></div></div><p class="tag">第'+(step+1)+'／'+t.steps.length+'步</p><h3>'+esc(t.steps[step])+'</h3><textarea id="a" placeholder="寫下你自己的想法……">'+esc(r[step]||'')+'</textarea><p class="sub">輸入後會保存在目前瀏覽器；換裝置不會同步。</p><button class="alt" id="prev">上一步</button><button id="next">'+(step===t.steps.length-1?'完成引導':'儲存並繼續')+'</button></div>';document.querySelector('#home').onclick=home;document.querySelector('#a').oninput=e=>{r[step]=e.target.value;save(t,r)};document.querySelector('#prev').onclick=()=>{if(step>0){step--;show()}};document.querySelector('#next').onclick=()=>{r[step]=document.querySelector('#a').value;save(t,r);if(!r[step].trim()){alert('先寫下你的想法。');return}if(step<t.steps.length-1){step++;show()}else done()}}
function done(){const t=task,r=get(t);root.innerHTML='<div class="paper"><h2>完成這次引導</h2><p class="sub">以下是你自己的思考紀錄。還不代表老師已確認作品。</p>'+t.steps.map((q,i)=>'<div class="card" style="margin:10px 0"><b>'+esc(q)+'</b><p>'+esc(r[i]||'')+'</p></div>').join('')+'<button id="copy">複製回答</button><button class="alt" id="back">返回題庫</button></div>';document.querySelector('#back').onclick=home;document.querySelector('#copy').onclick=()=>{const s=t.title+'\n'+t.steps.map((q,i)=>q+'\n'+(r[i]||'')).join('\n\n');if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>alert('已複製')).catch(()=>prompt('複製內容',s));else prompt('複製內容',s)}}
